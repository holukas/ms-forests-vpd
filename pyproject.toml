[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ms-forests-vpd"
version = "1.0.0"
description = "VPD and soil moisture controls on daytime forest NEP: XGBoost models with SHAP and ALE interpretation across FLUXNET sites"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Lukas Hörtnagl", email = "lukas.hoertnagl@usys.ethz.ch" }]

# Every direct dependency is pinned here. uv.lock fixes every package, and
# `uv sync --locked` recreates that environment. `pip install .` installs these
# pins only, not the lock file, so transitive packages may differ.
# This is an analysis repository, not a library. The pin that matters most is
# xgboost 3.0.5, the version that produced the results: rerunning the same data and
# the same seeds under 3.3.0 instead of 3.0.5 gives different models, with
# predictions correlating at 0.995, mean |SHAP| for VPD rising at every site
# tested and the VPD/SWC ratio rising by 6 to 21 %. Do not change that pin
# without rerunning the whole campaign and updating every number in the
# manuscript. shap 0.52.0 and scikit-learn 1.9.0 are newer than the versions that
# produced the results (shap 0.48.0, scikit-learn 1.6.1) and reproduce those
# results exactly. diive is installed from PyPI at the 0.91.1 release. numpy
# stays below 2.5 because numba, pulled in by shap, supports no more, and
# numba 0.53 does not build on Python 3.12.
dependencies = [
    "diive==0.91.1",
    "pandas==3.0.5",
    "numpy==2.4.6",
    "scipy==1.18.0",
    "matplotlib==3.11.1",
    "scikit-learn==1.9.0",
    "xgboost==3.0.5",
    "shap==0.52.0",
    "pyale==1.2.0",
    "statsmodels==0.14.6",
    "geopandas==1.1.4",
    "pyyaml==6.0.3",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
# Only needed to re-download ERA5 climate normals (scripts 16*).
# Both services require personal credentials, see docs/data.qmd.
era5 = [
    "earthengine-api>=1.7.15,<2.0.0",
    "cdsapi>=0.7.7,<1.0.0",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.2.4",
    "pytest>=8.3.3",
    # Documentation. quarto-cli ships the Quarto binary, so `uv run quarto`
    # works without a separate system install; ghp-import pushes the rendered
    # site to gh-pages by hand when the Actions run is not wanted.
    "quarto-cli>=1.10,<2.0",
    "ghp-import>=2.1.0,<3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
