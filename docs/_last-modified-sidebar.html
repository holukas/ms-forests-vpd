<!--
  Moves the "Modified" date of each page from the title block to the end of the right
  ("On this page") sidebar, as "Last updated". Quarto has no option to relocate title
  metadata, so this runs in the browser. Pages without a TOC get it in the left sidebar.
  Included through format.html.include-after-body in _quarto.yml.
-->
<style>
  .sidebar-last-modified {
    margin: 1rem 0 0.5rem;
    padding-top: 0.6rem;
    border-top: 1px solid rgba(128, 128, 128, 0.35);
    font-size: 0.8rem;
    color: inherit;
    opacity: 0.75;
    line-height: 1.35;
  }
  .sidebar-last-modified .slm-label {
    display: block;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 0.7rem;
    opacity: 0.85;
  }
</style>
<script>
  window.addEventListener("DOMContentLoaded", function () {
    var meta = document.querySelector(".quarto-title-meta");
    var dateEl = (meta || document).querySelector(".date-modified");
    if (!dateEl) return;
    var dateText = dateEl.textContent.trim();

    // The title block holds nothing else, since no page sets an author
    if (meta) meta.remove();

    var right = document.getElementById("quarto-margin-sidebar");
    var left = document.getElementById("quarto-sidebar");
    var host = right || left;
    if (!host) return;

    var box = document.createElement("div");
    box.className = "sidebar-last-modified";
    var label = document.createElement("span");
    label.className = "slm-label";
    label.textContent = "Last updated";
    box.appendChild(label);
    box.appendChild(document.createTextNode(dateText));

    if (right) {
      host.appendChild(box);
    } else {
      var container = left.querySelector(".sidebar-menu-container") || left;
      container.appendChild(box);
    }
  });
</script>
