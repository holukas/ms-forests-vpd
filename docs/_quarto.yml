project:
  type: website
  output-dir: _site
  # Written by scripts/90_deposit/94_build_data_flow_chart.py, embedded in index.qmd and pipeline.qmd
  resources:
    - data_flow.html

# Pages are written by hand and describe code that needs the full 185 GB data
# folder to run. Nothing here is executed at render time.
execute:
  enabled: false
  freeze: true

# "Last updated" in the right sidebar (_last-modified-sidebar.html). Quarto reads the
# file modification time, which the docs workflow sets to the last commit of each page.
date-modified: last-modified
date-format: "D MMMM YYYY"

website:
  title: "ms-forests-vpd"
  description: "Code documentation for the forest VPD / soil moisture SHAP analysis"
  repo-url: https://github.com/holukas/ms-forests-vpd
  favicon: favicon.png
  repo-actions: [source, issue]
  page-navigation: true
  navbar:
    logo: logo.png
    logo-alt: "ms-forests-vpd"
    left:
      - href: index.qmd
        text: Overview
      - href: installation.qmd
        text: Installation
      - href: data.qmd
        text: Data
      - href: columns.qmd
        text: Columns
      - href: pipeline.qmd
        text: Pipeline
      - href: methods.qmd
        text: Methods
      - href: figures.qmd
        text: Figures
    right:
      - icon: github
        href: https://github.com/holukas/ms-forests-vpd
  sidebar:
    style: docked
    contents:
      - index.qmd
      - installation.qmd
      - data.qmd
      - columns.qmd
      - pipeline.qmd
      - methods.qmd
      - figures.qmd
  page-footer:
    left: "Lukas Hörtnagl, ETH Zurich"
    right: "GPL-3.0"

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    lightbox: true
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
    include-after-body:
      - _last-modified-sidebar.html
