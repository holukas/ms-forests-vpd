    note: 'Source Data of Supplementary Table 5 (SupplementaryTable5.csv for the display table, SupplementaryTable5_data.csv
      for block a unrounded). Stage 8 is the compound extreme: TA z > 1.28, SM z < -1.28 and VPD z > 1.28
      within site. Per site, the SHAP values of its Stage 8 records are averaged, then sites with at least
      the minimum number of Stage 8 records are kept and summarized across sites, equal weight per site.
      The display csv holds formatted text: block a (rows of quantities, one column per minimum), a blank
      row, the header row ''b | Stage 7 against Stage 8 on matched records'' with the names of the two
      matchings in columns ''1'' and ''5'', then block b from 80_info script 89 in those two columns.'
    columns:
      a | Minimum Stage 8 records per site: 'Row label: the quantity of block a, the block b header, or
        a block b quantity'
      '1': 'Block a: value with a minimum of 1 Stage 8 record per site (all sites with Stage 8 records).
        Block b: value for matching on the same month and hour of day'
      '5': 'Block a: value with a minimum of 5 Stage 8 records per site. Block b: value for matching at
        any month and hour'
      '10': 'Block a: value with a minimum of 10 Stage 8 records per site, empty in block b'
      '20': 'Block a: value with a minimum of 20 Stage 8 records per site, empty in block b'
      '30': 'Block a: value with a minimum of 30 Stage 8 records per site, empty in block b'
      '50': 'Block a: value with a minimum of 50 Stage 8 records per site, empty in block b'
      '100': 'Block a: value with a minimum of 100 Stage 8 records per site, empty in block b'
      Minimum Stage 8 records per site: Minimum number of Stage 8 records a site needs to be kept
      Sites kept: Number of sites with at least that many Stage 8 records
      Stage 8 records kept: Number of Stage 8 records of the kept sites
      Share of Stage 8 records kept (%): Stage 8 records kept as % of all Stage 8 records of all sites
      Sites with a negative VPD effect: Number of kept sites with a negative site mean VPD SHAP value in Stage 8
      Share of kept sites with a negative VPD effect (%): The same as % of the kept sites
      Net effect (sigma): Mean across kept sites of the site mean net effect (sum of the four SHAP values)
        in Stage 8, in σ of NEP
      VPD effect (sigma): Mean across kept sites of the site mean VPD SHAP value in Stage 8, in σ of NEP
      SM effect (sigma): Mean across kept sites of the site mean SM SHAP value in Stage 8, in σ of NEP
      VPD to SM ratio: Ratio of the cross-site mean VPD effect to the cross-site mean SM effect
      VPD to SM ratio, 95% bootstrap: 95% interval of the ratio as text '[lo, hi]', 2.5th and 97.5th percentiles
        over 10000 bootstrap resamples of sites (seed 42)
      Share of kept sites with VPD below SM (%): '% of kept sites with a VPD effect more negative than
        their SM effect'
      VPD minus SM effect, median across sites (sigma): Median across kept sites of the site VPD effect
        minus the site SM effect, in σ of NEP
  outputs/50_plots/60_SUPPFIG-8:
    row: One row per site (208 sites)
    note: Source Data of Supplementary Fig. 8. Counts over the peak-season daytime
