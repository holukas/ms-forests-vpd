      SM (%): Median across sites of the percent of modeled records with SWC z-score at or below the cut-off
      SW (%): Median across sites of the percent of modeled records with SWIN z-score at or below the
        cut-off
  outputs/50_plots/62_SUPPTABLE-9:
    row: 'One row per group: all sites (Global forests) and the forest types ENF, DBF, MF, EBF'
    note: Source Data of Supplementary Table 9, built from 81_INFO_ThresholdDefinitions.csv. All points are read off the
      quartic fit of the Fig. 4 VPD response curve of the group (VPD SHAP value against the VPD z-score
      bin, medians across sites). Values are text with fixed decimals. A value followed by "(range edge)"
      lies within 2 % of the fitted range width from an end of the range. It marks where the fitted data end,
      not a feature of the curve. The zero crossing is never tested for the range edge. kPa values are
