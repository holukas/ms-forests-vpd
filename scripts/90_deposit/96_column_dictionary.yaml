# Column descriptions of every output table, read by 96_build_column_reference.py.
# Forms and statistics form the naming scheme shared by all files. Under products, keyed
# by the output id of 94_data_flow_graph.json, are the columns the scheme does not explain.
# Placeholders in column names: {VAR} a variable token, {N} a number, {COL} any column the
# scheme explains, {GRID_X} a number that is a grid value. A tuple column (column, statistic)
# of a parquet file is described by its first level.
intro: 'The deposit holds one zip archive per output stage (see [Data](data.qmd#deposited-outputs)).

  This page describes the columns of every csv and parquet file in them, grouped by the output

  of the [data flow chart](pipeline.qmd#data-flow-chart) that writes them. Most column names

  follow one naming scheme, described first. Under each output, the table lists only the

  columns the scheme does not explain.


  The page is written by `scripts/90_deposit/96_build_column_reference.py` from

  `96_column_dictionary.yaml`. The script also checks every description against the headers of

  the files on disk. The same descriptions, one row per column, are in `COLUMNS.csv` of the

  deposit. In 30_shap and 40_aggregation the deposit leaves out a csv file if a parquet file of the same name exists. The merged site files (12_parquet_merged) and the two ERA5-Land folders of script 16 are described here but are not in the deposit. Tables laid out

  for Word (xlsx) are not described. Their data are in the csv file of the same item.

  '
scheme_intro: 'A column name is a variable token, optionally followed by a form and a statistic, as in

  `VPD_ZSCORE_SHAPVALS` or `TA_ZSCORE_median`. All variables are half-hourly, or hourly at

  sites that measure hourly, and taken from the FLUXNET-formatted files of each site.

  σ is one standard deviation of a variable within a site, the unit of every z-score.

  SHAP values are in σ of the target flux. NEP is positive for net CO~2~ uptake. Parquet

  files 42 and 43 of 40_aggregation have two column levels, written here as (column, statistic).

  '
variables:
  TA:
  - air temperature
  - °C
  VPD:
  - vapor pressure deficit
  - hPa (CD-Ygb in Pa)
  SWC:
  - soil water content of the layer used
  - volumetric %
  SWIN:
  - incoming shortwave radiation
  - W m-2
  NEE:
  - net ecosystem exchange of CO2
  - µmol m-2 s-1
  NEP:
  - net ecosystem production (-NEE)
  - µmol m-2 s-1
  GPP:
  - gross primary production (nighttime partitioning, daytime partitioning at 17 sites without nighttime values)
  - µmol m-2 s-1
  RECO:
  - ecosystem respiration (nighttime partitioning, daytime partitioning at 17 sites without nighttime values)
  - µmol m-2 s-1
  LE:
  - latent heat flux
  - W m-2
  ET:
  - evapotranspiration from LE and TA
  - mm h-1
  PREC:
  - precipitation
  - mm
forms:
  '{VAR}': '{name}, measured ({unit})'
  '{VAR}_ZSCORE': '{name}, z-score within the site, in σ'
  '{VAR}_ZSCORE_SHAPVALS': SHAP value of {name} for the target flux, out of sample, in σ of the target
  '{VAR}_ZSCORE_PRED': Out-of-sample model prediction of the target flux, in σ of the target
  BIN_{VAR}_ZSCORE: Bin of the {name} z-score, lower edge of a 0.1σ bin [edge, edge + 0.1), in σ
  '{VAR}_Z0': Site mean of {name} over the modeled records, the value at z = 0 ({unit})
  '{VAR}_SD': Site standard deviation (ddof 1) of {name} over the modeled records ({unit})
  '{VAR}_Z+2': '{VAR}_Z0 plus two times {VAR}_SD ({unit})'
  '{VAR}_Z-2': '{VAR}_Z0 minus two times {VAR}_SD ({unit})'
  '{VAR}_MIN': Site minimum of {name} over the modeled records ({unit})
  '{VAR}_MAX': Site maximum of {name} over the modeled records ({unit})
  '{VAR}_ZSCORE_MIN': Site minimum of the {name} z-score over the modeled records, in σ
  '{VAR}_ZSCORE_MAX': Site maximum of the {name} z-score over the modeled records, in σ
  '{VAR}_VAR': Name of the FLUXNET column used for {name} at the site, -MISSING- if none was found
  '{VAR}_QC_VAR': Name of the FLUXNET quality flag column used with {name}, -MISSING- if none was found
  '{VAR}_AVG': Mean of the column named in {VAR}_VAR over all records of the merged site file, gap-filled
    values included
  '{VAR}_N_RECORDS': Number of records with a value in the column named in {VAR}_VAR, over the merged
    site file
statistics:
  mean: mean
  median: median
  min: minimum
  max: maximum
  count: number of values
  std: standard deviation (ddof 1)
  sem: standard error, std / sqrt(count)
  iqr: 25th and 75th percentile, as text
  POS_AVG: mean of the positive values over the records of the stage at one site
  NEG_AVG: mean of the negative values over the records of the stage at one site
  OVR_AVG: mean over the records of the stage at one site
  OVR_SD: standard deviation (ddof 1) over the records of the stage at one site
  OVR_MEDIAN: median over the records of the stage at one site
  OVR_ABS_AVG: mean of the absolute values over the records of the stage at one site
  OVR_ABS_MEDIAN: median of the absolute values over the records of the stage at one site
  OVR_ABS_SD: standard deviation (ddof 1) of the absolute values over the records of the stage at one
    site
products:
  outputs/10_datasets/11_datasets_info.csv:
    row: One row per raw flux dataset found in the five download sources, a site can have several rows
    note: Only datasets with an IGBP class in ECOSYSTEMS of config/settings.yaml (DBF, DNF, EBF, ENF, MF) are kept. Path columns
      hold Windows paths relative to a scripts subfolder (e.g. ..\..\data\00_raw\...). Drop the leading
      ..\ parts and read the rest relative to the data folder root, as src/paths.py resolve_stored_path
      does
    columns:
      SITE: FLUXNET site ID, e.g. AR-SLu
      ORIGIN: Network prefix of the raw dataset folder name (AMF, CNF, EUF, FLX, ICOS, JPF, KOF, TERN)
      DOWNLOADED_VIA: 'Download source of the dataset: SHUTTLE-CLI (fluxnet-shuttle CLI), AMERIFLUX, JAPANFLUX-URL
        (JapanFlux2024), FLUXNET_CP (FLUXNET from the ICOS Carbon Portal), FLUXNET_ORG (FLUXNET2015 from
        fluxnet.org)'
      _DIRNAME: Name of the raw dataset folder
      _DIRPATH: Path of the raw dataset folder, relative
      _FILEPATH: Path of the half-hourly FULLSET or FLUXMET file of the dataset, or the hourly file where
        no half-hourly file exists, relative
      IGBP: IGBP vegetation class from the site metadata list of the source
      LON: Site longitude in decimal degrees from the site metadata list of the source
      LAT: Site latitude in decimal degrees from the site metadata list of the source
      ELEVATION: Site elevation from the site metadata list, in m, empty where the source gives none (all
        SHUTTLE-CLI and FLUXNET_CP datasets)
      PRIORITY: Merge priority of the download source, 1 = used first where datasets of a site overlap
        (SHUTTLE-CLI 1, AMERIFLUX and JAPANFLUX-URL 2, FLUXNET_CP 3, FLUXNET_ORG 4)
  outputs/10_datasets/12_parquet_merged/<SITE> (per site):
    row: One row per half-hourly or hourly record of one site
    note: 'Not in the deposit. Datasets of one site are stacked by PRIORITY. Where two datasets overlap, the one ending later
      is kept and the other is cut to end before it starts. If the datasets differ in time resolution,
      the finer one is averaged to the coarser one, which also averages its TIMESTAMP_START and QC flags
      (US-UMB: the AMF part has TIMESTAMP_START values like ...15 that are means of two start stamps)'
    skip: 'FLUXNET passthrough: 68 to 264 FLUXNET columns (most 150 to 250) as delivered by the networks,
      documented by FLUXNET. Only the columns added by the pipeline are listed'
    columns:
      ORIGIN: Network prefix of the raw dataset that supplied the record (e.g. FLX, ICOS, AMF)
      TIMESTAMP_MIDDLE: Middle of the averaging interval of the record (index of the file), in the time
        of the FLUXNET files
  outputs/10_datasets/12_datasets_info_parquet.csv:
    row: One row per site, after merging its datasets
    note: 'Same columns as 11_datasets_info.csv with these differences: for a site with several datasets
      the values come from the dataset with the best PRIORITY, gaps filled from the others, and ORIGIN
      joins the network prefixes of all merged datasets with + in priority order (e.g. ICOS+FLX). Path
      columns are relative, see 11_datasets_info.csv'
    columns:
      SITE: FLUXNET site ID
      ORIGIN: Network prefixes of the datasets merged for the site, joined with + in priority order
      DOWNLOADED_VIA: Download source of the highest-priority dataset of the site
      _DIRNAME: Name of the raw folder of the highest-priority dataset
      _DIRPATH: Path of the raw folder of the highest-priority dataset, relative
      _FILEPATH: Path of the raw data file of the highest-priority dataset, relative
      IGBP: IGBP vegetation class of the highest-priority dataset
      LON: Site longitude in decimal degrees
      LAT: Site latitude in decimal degrees
      ELEVATION: Site elevation in m, empty where no source gives it
      PRIORITY: Merge priority of the highest-priority dataset of the site (1 SHUTTLE-CLI, 2 AMERIFLUX
        or JAPANFLUX-URL, 4 FLUXNET_ORG)
      _FILEPATH_PARQUET: Path of the merged site file in 10_datasets/12_parquet_merged/, relative
  outputs/10_datasets/13_datasets_info_parquet_vars.csv:
    row: One row per site
    note: Columns of 12_datasets_info_parquet.csv plus the FLUXNET column chosen for each variable role.
      Written by 13b_check_available_vars_SWC.py (13_check_available_vars.py writes the same file). For
      a role with a list of candidates the first candidate that exists and has any value is taken, for
      a role with one candidate only its presence is checked. -MISSING- means no candidate was found
    columns:
      SITE: FLUXNET site ID
      ORIGIN: Network prefixes of the merged datasets, see 12_datasets_info_parquet.csv
      DOWNLOADED_VIA: Download source of the highest-priority dataset
      _DIRNAME: Name of the raw folder of the highest-priority dataset
      _DIRPATH: Path of the raw folder of the highest-priority dataset, relative
      _FILEPATH: Path of the raw data file of the highest-priority dataset, relative
      IGBP: IGBP vegetation class
      LON: Site longitude in decimal degrees
      LAT: Site latitude in decimal degrees
      ELEVATION: Site elevation in m, empty where no source gives it
      PRIORITY: Merge priority of the highest-priority dataset
      _FILEPATH_PARQUET: Path of the merged site file, relative
      NEE_VAR: 'NEE column, used for NEP: first of NEE_VUT_50, NEE_vUT_USTAR50, NEE_CUT_50 with data'
      NEE_QC_VAR: 'NEE quality flag column: first of NEE_VUT_50_QC, NEE_vUT_USTAR50 (the NEE column itself, taken at 5 JapanFlux2024 sites outside the analysis), NEE_CUT_50_QC with
        data'
      LE_VAR: 'Latent heat flux column, used for ET: LE_F_MDS'
      LE_QC_VAR: 'Quality flag of LE: LE_F_MDS_QC'
      GPP_VAR: 'GPP column: first of GPP_NT_VUT_50, GPP_NT_vUT_USTAR50, GPP_NT_CUT_50, GPP_DT_VUT_50,
        GPP_DT_vUT_USTAR50, GPP_DT_CUT_50 with data'
      RECO_VAR: 'RECO column: first of RECO_NT_VUT_50, RECO_NT_vUT_USTAR50, RECO_NT_CUT_50, RECO_DT_VUT_50,
        RECO_DT_vUT_USTAR50, RECO_DT_CUT_50 with data'
      SWIN_VAR: 'Incoming shortwave radiation column: SW_IN_F'
      SWIN_QC_VAR: 'Quality flag of SWIN: SW_IN_F_QC'
      TA_VAR: 'Air temperature column: TA_F'
      TA_QC_VAR: 'Quality flag of TA: TA_F_QC'
      VPD_VAR: 'Vapor pressure deficit column: VPD_F'
      VPD_QC_VAR: 'Quality flag of VPD: VPD_F_QC'
      PREC_VAR: 'Precipitation column: P_F'
      SWC_VAR: 'Soil water content column: first of SWC_F_MDS_1, SWC_F_MDS_2 with data'
      SWC_QC_VAR: 'Quality flag of SWC: first of SWC_F_MDS_1_QC, SWC_F_MDS_2_QC with data, chosen independently
        of SWC_VAR'
  outputs/10_datasets/13b_variables_per_site.csv:
    row: One row per site, scan type and matching column of the merged site file
    note: All 300 merged sites. A column is listed under a scan type if its name contains the scan string
      anywhere. For TA this includes e.g. USTAR, TIMESTAMP_START and NEE_CUT_USTAR50_QC. Peak months
      are the four calendar months with the highest mean GPP (column GPP_VAR) over the whole record, the
      same definition as the subsets
    columns:
      SITE: FLUXNET site ID
      IGBP: IGBP vegetation class
      USED_SITE: True if the site is in 15_datasets_info_parquet_vars_stats_usedsites.csv of an earlier
        run, False otherwise (all False if that file did not exist)
      VARIABLE_TYPE: 'Scan string the column matched: NEE, TA, SWC, SW_IN or VPD'
      VARIABLE_NAME: Name of the column in the merged site file
      N_VALID: Count of records with a value in the column, whole record
      N_TOTAL: Count of all records of the site, whole record
      PCT_NONNULL: N_VALID as percent of N_TOTAL
      N_VALID_PEAK: Count of records with a value in the column, within the four peak months, 0 if the
        site has no GPP
      N_TOTAL_PEAK: Count of all records within the four peak months, 0 if the site has no GPP
      PCT_NONNULL_PEAK: N_VALID_PEAK as percent of N_TOTAL_PEAK, empty if the site has no GPP
      PEAK_MONTHS: The four peak months as month numbers joined with +, highest mean GPP first (e.g. 7+8+6+9),
        empty if the site has no GPP
      PEAK_VS_SWC1: 'For soil water layers SWC_F_MDS_<n> only: N_VALID_PEAK of this layer divided by N_VALID_PEAK
        of SWC_F_MDS_1 at the same site, fraction (1 = as many peak-month records as layer 1), empty for
        other columns or if layer 1 has no peak-month data'
  outputs/10_datasets/13b_variables_coverage_summary.csv:
    row: One row per scan type and column name found at any site, sorted by SITES_WITH_DATA within each
      scan type
    note: Percent columns are text with one decimal and a % sign (e.g. 92.0%). A site counts as having
      data if the column has at least one value over the whole record. Used sites are those with USED_SITE
      True in 13b_variables_per_site.csv
    columns:
      VARIABLE_TYPE: 'Scan string the column matched: NEE, TA, SWC, SW_IN or VPD'
      VARIABLE_NAME: Name of the column in the merged site files
      SITES_WITH_DATA: Count of scanned sites where the column has data
      TOTAL_SITES: Count of scanned sites (all merged sites)
      COVERAGE_PERCENT: SITES_WITH_DATA as percent of TOTAL_SITES
      AVG_NONNULL_PERCENT: Mean of PCT_NONNULL (whole record) across the sites where the column has data,
        equal weight per site
      SITES_WITH_DATA_USED: Count of used sites where the column has data
      TOTAL_SITES_USED: Count of used sites among the scanned sites
      COVERAGE_PERCENT_USED: SITES_WITH_DATA_USED as percent of TOTAL_SITES_USED
      MEDIAN_NONNULL_PEAK_PERCENT_USED: Median of PCT_NONNULL_PEAK across used sites where the column
        has data, equal weight per site
  outputs/10_datasets/14_datasets_info_parquet_vars_stats.csv:
    row: One row per site (all 300 merged sites)
    note: 'Columns of 13_datasets_info_parquet_vars.csv plus record counts and means over the whole merged
      site file. Families {VAR}_VAR, {VAR}_QC_VAR, {VAR}_AVG and {VAR}_N_RECORDS follow the naming scheme,
      with VAR in NEE, LE, GPP, RECO, SWIN, TA, VPD, SWC and PREC (no _QC_VAR for GPP, RECO and PREC, no
      PREC_AVG). SWC, GPP and RECO _AVG and _N_RECORDS hold -MISSING- at sites without the variable. Values
      are in the FLUXNET units: VPD in hPa (CD-Ygb in Pa), SWC in percent. Path columns are relative,
      see 11_datasets_info.csv'
    columns:
      SITE: FLUXNET site ID
      ORIGIN: Network prefixes of the merged datasets joined with + in priority order
      DOWNLOADED_VIA: Download source of the highest-priority dataset
      _DIRNAME: Name of the raw folder of the highest-priority dataset
      _DIRPATH: Path of the raw folder of the highest-priority dataset, relative
      _FILEPATH: Path of the raw data file of the highest-priority dataset, relative
      IGBP: IGBP vegetation class
      LON: Site longitude in decimal degrees
      LAT: Site latitude in decimal degrees
      ELEVATION: Site elevation in m, empty where no source gives it
      PRIORITY: Merge priority of the highest-priority dataset, 1 = top
      _FILEPATH_PARQUET: Path of the merged site file, relative
      DATE_FIRST: Date of the first record of the merged site file, as DD Mon YYYY
      DATE_LAST: Date of the last record of the merged site file, as DD Mon YYYY
      N_YEARS: Calendar years spanned by the record, last year minus first year plus 1, partial years
        counted
      N_RECORDS: Count of records (rows) in the merged site file, at its time step of 30 or 60 min
      PREC/YR: Sum of P_F over the whole record divided by N_YEARS, in mm per year
  outputs/10_datasets/15_datasets_info_parquet_vars_stats_usedsites.csv:
    row: One row per site used in the analysis (209 sites)
    note: Same columns and meaning as 14_datasets_info_parquet_vars_stats.csv, restricted to sites with
      SWC, GPP and RECO, IGBP not DNF and N_YEARS of at least 3
    columns:
      SITE: FLUXNET site ID
      ORIGIN: Network prefixes of the merged datasets joined with + in priority order
      DOWNLOADED_VIA: Download source of the highest-priority dataset
      _DIRNAME: Name of the raw folder of the highest-priority dataset
      _DIRPATH: Path of the raw folder of the highest-priority dataset, relative
      _FILEPATH: Path of the raw data file of the highest-priority dataset, relative
      IGBP: IGBP vegetation class
      LON: Site longitude in decimal degrees
      LAT: Site latitude in decimal degrees
      ELEVATION: Site elevation in m, empty where no source gives it
      PRIORITY: Merge priority of the highest-priority dataset, 1 = top
      _FILEPATH_PARQUET: Path of the merged site file, relative
      DATE_FIRST: Date of the first record of the merged site file, as DD Mon YYYY
      DATE_LAST: Date of the last record of the merged site file, as DD Mon YYYY
      N_YEARS: Calendar years spanned by the record, last year minus first year plus 1, partial years
        counted
      N_RECORDS: Count of records (rows) in the merged site file, at its time step of 30 or 60 min
      PREC/YR: Sum of P_F over the whole record divided by N_YEARS, in mm per year
  outputs/10_datasets/16_ERA5_climate_1991-2020/ (per site, legacy):
    row: 'Hourly files: one row per hour. Yearly files: one row per year 1991 to 2020. Raw files: one
      row per hour as downloaded'
    note: 'Legacy, not read by any later script, not in the deposit. Same layout as the Copernicus folder, made by 16_download_era5_mat_map.py
      for FLUXNET_ORG sites only, with the site coordinates rounded to 0.1°. Files per site: <SITE>_era5_1991-2020_shifted.csv
      (hourly), <SITE>_era5_1991-2020_yearly.csv, and in raw/ the two CDS files (2 m temperature, precipitation).
      The yearly file is not checked for 30 complete years. ERA5-Land time series from the Copernicus
      CDS'
    columns:
      valid_time: 'Raw files: end of the hour in UTC as delivered by CDS. _shifted file: 1 h earlier,
        the start of the hour, 1991-01-01 00:00 to 2020-12-31 23:00. _yearly file: first day of the year
        (YYYY-01-01)'
      t2m: 'Raw temperature file: ERA5-Land 2 m air temperature in K'
      tp: 'Raw precipitation file: ERA5-Land total precipitation of the hour in m'
      latitude: 'Raw files: latitude of the ERA5-Land grid point in decimal degrees'
      longitude: 'Raw files: longitude of the ERA5-Land grid point in decimal degrees'
      TA_degC: '2 m air temperature in °C. _shifted file: hourly value (t2m minus 273.15). _yearly file:
        annual mean of the hourly values'
      PRECIP_TOT_mm: 'Precipitation in mm. _shifted file: amount of the hour (tp times 1000). _yearly
        file: annual sum'
      LAT: Latitude of the ERA5-Land grid point in decimal degrees
      LON: Longitude of the ERA5-Land grid point in decimal degrees
  outputs/10_datasets/16_ERA5_..._GoogleEarthEngine/ (per site):
    row: One row per year 1991 to 2020 for one site
    note: Not read by any later script. ERA5 (not ERA5-Land) daily collection ECMWF/ERA5/DAILY
      on Google Earth Engine, value of the grid cell at the site coordinates (scale 27830 m). A file is
      written only if all 30 years have values
    columns:
      Year: Calendar year
      MAT_degC: Mean of the daily mean 2 m air temperature over the year, in °C
      PRECIP_TOT_mm: Sum of the daily total precipitation over the year, in mm
  outputs/10_datasets/16_ERA5_..._Copernicus/ (per site):
    row: 'Hourly file: one row per hour 1991 to 2020. Yearly file: one row per year 1991 to 2020. Raw
      files: one row per hour as downloaded'
    note: 'Only the yearly file of each site is in the deposit. ERA5-Land time series from the Copernicus CDS at the site coordinates, or at the nearest land
      cell for sites in ERA5_LAND_POINT_OVERRIDE (sea cells). Files per site: <SITE>_era5_1991-2020_shifted.csv
      (hourly), <SITE>_era5_1991-2020_yearly.csv (read by script 17), and in raw/ the two CDS files (2
      m temperature, precipitation). The yearly file exists only if all 30 years are present. Timestamps
      are shifted back 1 h so that the precipitation of an hour falls into the year it belongs to. Temperature
      is shifted too'
    columns:
      valid_time: 'Raw files: end of the hour in UTC as delivered by CDS. _shifted file: 1 h earlier,
        the start of the hour, 1991-01-01 00:00 to 2020-12-31 23:00. _yearly file: first day of the year
        (YYYY-01-01)'
      t2m: 'Raw temperature file: ERA5-Land 2 m air temperature in K'
      tp: 'Raw precipitation file: ERA5-Land total precipitation of the hour in m'
      latitude: 'Raw files: latitude of the ERA5-Land grid point in decimal degrees'
      longitude: 'Raw files: longitude of the ERA5-Land grid point in decimal degrees'
      TA_degC: '2 m air temperature in °C. _shifted file: hourly value (t2m minus 273.15). _yearly file:
        annual mean of the hourly values'
      PRECIP_TOT_mm: 'Precipitation in mm. _shifted file: amount of the hour (tp times 1000). _yearly
        file: annual sum'
      LAT: Latitude of the ERA5-Land grid point in decimal degrees
      LON: Longitude of the ERA5-Land grid point in decimal degrees
  outputs/10_datasets/17_datasets_info_parquet_vars_stats_usedsites_era5.csv:
    row: One row per site used in the analysis (209 sites)
    note: Columns of 15_datasets_info_parquet_vars_stats_usedsites.csv plus the 1991-2020 site climate.
      The climate values describe the sites (Fig. 1b, Supplementary Table 1) and enter no analysis. Despite
      the ERA5_ prefix, values come from FLUXNET TA_ERA and P_ERA (ERA5 downscaled to the site by ONEFlux)
      where the flux product has an ERA5 yearly file, otherwise from ERA5-Land (for MAP also where P_ERA
      is not usable, see ERA5_MAP_REASON)
    columns:
      SITE: FLUXNET site ID
      ORIGIN: Network prefixes of the merged datasets joined with + in priority order
      DOWNLOADED_VIA: Download source of the highest-priority dataset
      _DIRNAME: Name of the raw folder of the highest-priority dataset
      _DIRPATH: Path of the raw folder of the highest-priority dataset, relative
      _FILEPATH: Path of the raw data file of the highest-priority dataset, relative
      IGBP: IGBP vegetation class
      LON: Site longitude in decimal degrees
      LAT: Site latitude in decimal degrees
      ELEVATION: Site elevation in m, empty where no source gives it
      PRIORITY: Merge priority of the highest-priority dataset, 1 = top
      _FILEPATH_PARQUET: Path of the merged site file, relative
      DATE_FIRST: Date of the first record of the merged site file, as DD Mon YYYY
      DATE_LAST: Date of the last record of the merged site file, as DD Mon YYYY
      N_YEARS: Calendar years spanned by the record, last year minus first year plus 1, partial years
        counted
      N_RECORDS: Count of records (rows) in the merged site file, at its time step of 30 or 60 min
      PREC/YR: Sum of P_F over the whole record divided by N_YEARS, in mm per year
      ERA5_MAT_1991_2020: Mean annual air temperature 1991-2020 in °C, mean of the 30 yearly values from
        the source in ERA5_MAT_SOURCE, rounded to 3 decimals
      ERA5_MAP_1991_2020: Mean annual precipitation 1991-2020 in mm per year, mean of the 30 yearly sums
        from the source in ERA5_MAP_SOURCE, rounded to 3 decimals
      ERA5_MAT_SOURCE: 'Source of ERA5_MAT_1991_2020: FLUXNET TA_ERA (ERA5 yearly file of the flux product)
        or ERA5-Land (16_ERA5_..._Copernicus yearly file)'
      ERA5_MAP_SOURCE: 'Source of ERA5_MAP_1991_2020: FLUXNET P_ERA (ERA5 yearly file of the flux product)
        or ERA5-Land (16_ERA5_..._Copernicus yearly file)'
      ERA5_MAT_REASON: 'Why ERA5-Land was used for MAT: no ERA5 file in the flux product, or override:
        <reason> from config/site_climate_source_override.csv, empty if FLUXNET TA_ERA was used'
      ERA5_MAP_REASON: 'Why ERA5-Land was used for MAP, as text: "no ERA5 file in the flux product", "no
        site precipitation, P_ERA not scaled", "P_ERA <n>% off the site-reported MAP (<source>), ERA5-Land
        <n>%" (P_ERA more than 25% off and ERA5-Land closer), or "override: <reason>". Empty if FLUXNET
        P_ERA was used'
  outputs/20_subsets/<SITE> subset parquet (per site):
    row: One row per half-hourly or hourly record of one site that passed all subset filters
    note: 'File 21_subsets_parquet/<SITE>_subset_GPPhighest4_qc0_daytime.parquet, main run and deep-sm.
      Filters in order: measured NEE (QC flag 0), daytime (SW_IN_POT above 20 W m-2), the four months
      with the highest mean GPP over the whole record, the same number of years for each of these months
      (latest years kept), no missing value in any of the eight measured variables. Columns are the naming scheme
      forms {VAR} (measured, FLUXNET units, VPD in hPa, CD-Ygb in Pa) and {VAR}_ZSCORE for NEE, LE, GPP,
      RECO, TA, VPD, SWIN, SWC, ET, NEP. NEP is NEE times -1. ET is computed from LE and TA (diive et_from_le)
      in mm h-1. The z-scores are computed over the records of this file with the population standard
      deviation (ddof 0). In deep-sm, SWC is the deepest soil water layer that has at least 90% of the
      peak-month records of layer 1 (see SWC_VAR in its 21_SUBSETS table)'
    columns:
      TIMESTAMP_MIDDLE: Middle of the averaging interval of the record (index of the file), in the time
        of the FLUXNET files
  outputs/20_subsets/21_SUBSETS_parquet_vars_stats_subsets.csv:
    row: One row per site with a non-empty subset (208 sites)
    note: 'One file per run variant: main, deep-sm, blocked-cv, no_ta, no_vpd. The blocked-cv, no_ta and
      no_vpd tables point to the main subset files. All statistics are over the subset records of the
      site, the same records the z-scores are computed on. Families follow the naming scheme with VAR in NEE,
      LE, GPP, RECO, TA, VPD, SWIN, SWC, ET, NEP: {VAR}_ZSCORE_MIN, {VAR}_ZSCORE_MAX, {VAR}_Z0, {VAR}_SD,
      {VAR}_Z+2, {VAR}_Z-2, {VAR}_MIN, {VAR}_MAX. Measured values in FLUXNET units (VPD in hPa, CD-Ygb
      in Pa). SWC_VAR and SWC_LAYER appear only in the deep-sm table, the other four tables were written
      before the code added them'
    columns:
      SITE: FLUXNET site ID
      DATE_FIRST: Date of the first subset record, as DD Mon YYYY
      DATE_LAST: Date of the last subset record, as DD Mon YYYY
      N_YEARS: Calendar years spanned by the subset, last year minus first year plus 1 (a December to
        February season counts 2)
      N_RECORDS: Count of subset records of the site
      _FILEPATH_PARQUET_SUBSET: Absolute path of the subset parquet file on the machine that wrote it
      SWC_VAR: 'deep-sm only: FLUXNET soil water column used as SWC (SWC_F_MDS_<n>)'
      SWC_LAYER: 'deep-sm only: layer number n of SWC_VAR, -9999 if the name has no layer number'
      LAT: Site latitude in decimal degrees
      LON: Site longitude in decimal degrees
      ELEVATION: Site elevation in m, empty where no source gives it
      IGBP: IGBP vegetation class
  outputs/20_subsets/22_data_flow.csv:
    row: One row per site used in the analysis (209 sites, US-xBN ends with 0 records and has no subset)
    note: Main run only. Record counts after each filter step of stage 21, in the order of the steps.
      complete_cases equals N_RECORDS in 21_SUBSETS_parquet_vars_stats_subsets.csv, checked by the script
    columns:
      SITE: FLUXNET site ID
      IGBP: IGBP vegetation class
      all_records: Count of all records in the merged site file
      measured_nee: Records left after keeping measured NEE (QC flag 0)
      daytime: Records left after keeping daytime (SW_IN_POT above 20 W m-2)
      peak_months: Records left after keeping the four months with the highest mean GPP over the whole
        record
      year_balanced: Records left after giving each of the four months the same number of years, latest
        years kept
      complete_predictors: Records left after dropping records with a missing value in NEE, TA, VPD,
        SWIN or SWC
      complete_cases: Records of complete_predictors that also have LE, GPP and RECO, the modeled records
      SWC_VAR: FLUXNET soil water column used as SWC
  outputs/30_shap/<FLUX>/conditional/<SITE>_shap-conditional_<FLUX>.parquet (per site):
    row: One half-hourly or hourly record of the peak-season subset of one site (4 peak-GPP months, daytime,
      measured NEE with QC flag 0, all variables present)
    note: 'Every record of the subset is in the file, with the prediction and the SHAP values of the fold
      model that held it out in cross-validation: shuffled 5-fold KFold (random_state 42) in the main run
      and the deep-sm, no_ta and no_vpd variants, one calendar year left out per fold in blocked-cv (sites
      with a single year are missing). XGBoost hyperparameters are fixed for all sites.
      SHAP is TreeSHAP with tree_path_dependent (conditional) perturbation. Predictors are TA_ZSCORE,
      SWIN_ZSCORE, VPD_ZSCORE and SWC_ZSCORE in the full set, the no_ta variant has no TA_ZSCORE_SHAPVALS
      column and the no_vpd variant has no VPD_ZSCORE_SHAPVALS column. The target is the flux in the folder
      name (NEP_ZSCORE in the main run, also GPP_ZSCORE, RECO_ZSCORE, ET_ZSCORE). All other columns ({VAR}
      in its unit and {VAR}_ZSCORE, z-score within the site subset) are passed through from the subset
      file. A positive SHAP value raises the predicted target (for NEP more net uptake).'
    columns:
      TIMESTAMP_MIDDLE: Middle of the averaging period of the record (30 or 60 min, as in the source data),
        written pandas index
      EXPECTED: SHAP base value in σ of the target, mean over the folds of each fold explainer's expected
        model output, one constant per site file
      SUM: Sum of the {VAR}_ZSCORE_SHAPVALS columns of the record, in σ of the target
      SUM+EXPECTED: EXPECTED plus SUM, in σ of the target, reconstructs the prediction up to the difference
        between the fold's own base value and the fold mean (at most about 0.03 σ), use {VAR}_ZSCORE_PRED
        for the exact prediction
      '{VAR}_ZSCORE_PRED': Out-of-fold prediction of the target for this record, in σ of the target
  outputs/30_shap/<FLUX>/conditional/2_cv_results_all_sites.csv:
    row: One site
    note: 'Cross-validation scores of the models behind the per-site SHAP files. Main run and variants
      deep-sm, no_ta, no_vpd: 5 shuffled folds (fold_1 to fold_5). blocked-cv variant: one fold per calendar
      year in the site subset, fold 1 the earliest year, up to 28 folds. Columns of folds a site does
      not have are empty, and the column order follows the first site written (global_r2 and global_rmse
      follow fold_2). Sites with a single year have no row.'
    columns:
      site: Site code
      target: Target flux of the models, e.g. NEP_ZSCORE
      fold_{N}_r2: Coefficient of determination of fold N model on its held-out records
      fold_{N}_rmse: Root mean square error of fold N model on its held-out records, in σ of the target
      global_r2: Coefficient of determination of the pooled out-of-fold predictions against observations,
        all records of the site
      global_rmse: Root mean square error of the pooled out-of-fold predictions, all records of the site,
        in σ of the target
  outputs/30_shap/<FLUX>/ale/<SITE>_ale_curves (per site):
    row: One grid point of the ALE curve of one predictor at one site
    note: Accumulated local effects (PyALE, grid_size 100) from one XGBoost model per site, fitted on
      85 percent of the subset records (15 percent for early stopping) with the hyperparameters of script
      31 and evaluated on all records. Predictors TA_ZSCORE, SWIN_ZSCORE, VPD_ZSCORE, SWC_ZSCORE, usually
      101 points each (fewer if quantile edges coincide). Parquet and csv twins have the same columns.
    columns:
      feature_value: Quantile bin edge of the predictor, in σ of the predictor (z-score within site),
        the first point is the predictor minimum
      effect: Centered accumulated local effect at feature_value, in σ of the target, centered so that
        the record-weighted mean effect is zero
      feature: Predictor name, e.g. VPD_ZSCORE
      site: Site code
      target: Target flux of the model, e.g. NEP_ZSCORE
      IGBP: IGBP forest type of the site
      LAT: Site latitude in decimal degrees, from the 21 subsets table
      LON: Site longitude in decimal degrees, from the 21 subsets table
      ELEVATION: Site elevation from the 21 subsets table, NaN where unknown
      N_RECORDS: Number of records in the site subset (count)
  outputs/30_shap/<FLUX>/ale/<SITE>_ale parquet (per site):
    row: One row per modeled record of one site, as in the subset file
    note: Input data of the ALE model of script 32 with its prediction. The ALE model is one XGBoost model
      per site, fitted on 85 percent of the records (random split), separate from the cross-validated
      models behind the SHAP values.
    columns:
      TIMESTAMP_MIDDLE: Middle of the averaging period of the record (30 or 60 min, as in the source data),
        written pandas index
      '{VAR}_ZSCORE_PRED': Prediction of the ALE model for every record, in σ of the target, in-sample
        for the 85 percent of records the model was fitted on
  outputs/30_shap/<FLUX>/ale/0_ale_validation_sites.csv:
    row: One site
    note: Fit of the single ALE model per site, scored on all subset records including the 85 percent
      used for training. The scores are in-sample and not comparable to the out-of-fold scores of
      2_cv_results
    columns:
      site: Site code
      target: Target flux, e.g. NEP_ZSCORE
      r2_full: Coefficient of determination of the ALE model on all records of the site, in-sample
      rmse_full: Root mean square error of the ALE model on all records of the site, in σ of the target,
        in-sample
      n_records: Number of records used (count)
      n_features: Number of predictors (count)
  outputs/40_aggregation/41_SHAPVALUES meanAggregatedPerSite (per grid):
    row: One site and one cell of the 179 by 179 grid of the two binning variables, including cells with
      no records of that site (all values NaN)
    note: Each file is one grid, named BIN-{x}+BIN-{y}+{FLUX}, with x and y from TA+VPD, SWC+VPD, TA+SWC,
      ET+VPD, ET+SWC (z-scores). Records of the per-site SHAP file are binned on x_ZSCORE and y_ZSCORE
      (bins of 0.1 σ, see BIN_{VAR}_ZSCORE), and every other column is the mean over the records of the site
      in the cell (aggregation mean, at least 1 record). {VAR} is then the bin mean in its unit, {VAR}_ZSCORE
      and the SHAP columns are bin means in σ. No record count per cell is stored. Every site has 32041
      rows, about 97 percent of them empty. Remove rows where the value columns are NaN before use. Variants
      blocked-cv, deep-sm and no_ta (no no_vpd), plus deeper-only and deep-sm/deeper-only with the 128 sites that use a layer below SWC_F_MDS_1 in deep-sm.
    columns:
      BIN_{VAR}_ZSCORE: Lower edge of the 0.1 σ bin of VAR_ZSCORE for this cell, interval [edge, edge
        + 0.1), zero bin labeled -0.0
      EXPECTED: SHAP base value of the site, in σ of the target (constant per site, NaN in empty cells)
      SUM: Mean over the cell's records of the summed SHAP values, in σ of the target
      SUM+EXPECTED: Mean over the cell's records of SUM+EXPECTED, in σ of the target
      '{VAR}_ZSCORE_PRED': Mean over the cell's records of the out-of-fold prediction, in σ of the target
      SITE: Site code
      IGBP: IGBP forest type of the site
      __index_level_0__: Written pandas index, row number 0 to 32040 within the site, restarts for each
        site, no meaning
  outputs/40_aggregation/42_SHAPVALUES AggregatedAcrossSites (per grid):
    row: One grid cell (pair of bins) that holds a value for at least one site
    note: 'Two-level columns, first level a column of the naming scheme, second level a statistic. The parquet schema
      stores them as strings like (''VPD_ZSCORE_SHAPVALS'', ''mean''), pandas.read_parquet restores the
      two levels. Input is the 41 file of the same grid, DNF sites removed. Aggregation is two-step: first
      the mean over records within a site and cell (file 41), then the statistics over these per-site
      means, each site with equal weight. All statistics are taken over sites, and count is the number
      of sites with data in the cell, not of records.
      The figures use only cells with count at least ceil(N_SITES / 2). Only columns {VAR}_ZSCORE, {VAR}_ZSCORE_SHAPVALS
      and the BIN columns are aggregated, the measured-unit columns, EXPECTED, SUM, SUM+EXPECTED and the
      prediction are not in the file. Rows are sorted as strings by BIN_COMBINED_STR, not numerically.'
    columns:
      BIN_{VAR}_ZSCORE: Lower edge of the 0.1 σ bin of VAR_ZSCORE for the cell (median of identical labels),
        interval [edge, edge + 0.1)
      N_SITES: Total number of sites that went into the file (count), same in every row, the denominator
        for the per-cell site count
      BIN_COMBINED_STR: Cell label x+y, the lower bin edges of the first and second grid variable of the
        file name, one decimal, zero written -0.0 (e.g. -0.0+0.5), written pandas index
  outputs/40_aggregation/43_SHAPVALUES AcrossIGBP (per forest type, grid):
    row: One cell of the full 179 by 179 grid for one forest type, including cells no site of that type
      reaches
    note: Same layout and statistics as file 42, computed separately over the sites of one IGBP forest
      type (DBF, EBF, ENF, MF, named in the file name, DNF excluded), each site with equal weight. Unlike
      42, cells without any site are kept, with count 0 and NaN in the other statistics. Most rows are
      such cells.
    columns:
      BIN_{VAR}_ZSCORE: Lower edge of the 0.1 σ bin of VAR_ZSCORE for the cell (median of identical labels),
        interval [edge, edge + 0.1)
      N_SITES: Number of sites of this forest type that went into the file (count), same in every row
      BIN_COMBINED_STR: Cell label x+y, the lower bin edges of the first and second grid variable of the
        file name, one decimal, zero written -0.0, written pandas index
  outputs/40_aggregation/44_SHAPVALUES AggregatedAcrossScenarios:
    row: One site and one stress stage (9 stages per site, 16 factorial cells per site in factorial-cells/)
    note: 'Per-site rows only. Stage statistics {COL}_* are
      taken over the records of the site that fall in the stage, for every column of the per-site SHAP
      file, measured variables and z-scores included. The entries EXPECTED, SUM and SUM+EXPECTED below describe the base of their {COL}_* columns. Stages are masks on TA_ZSCORE, VPD_ZSCORE and
      SWC_ZSCORE with cuts a = 0.3186 (middle 25 percent of a normal distribution), b = 0.7144 and c =
      1.2816 (10th and 90th percentile). Main sequence: 0 all data, 1 all three drivers within plus or
      minus a, 2 warm, 3 warm and dry soil, 4 hot and dry soil, 5 hot and very dry soil, 6 extremely hot
      and very dry soil, 7 extremely hot and extremely dry soil, stages 2 to 7 with VPD_ZSCORE at most
      c, 8 compound extreme with TA and VPD above c and SWC below -c. mirrored-stages/ swaps the roles
      of VPD and soil water, factorial-cells/ crosses 4 soil water classes with 4 VPD classes and leaves
      TA free. Across-site stage summaries (mean of site means, sem, and a total SD by the law of total
      variance, sqrt of the mean of within-site variances plus the ddof 0 variance of site means) are
      computed on the fly by calculate_stage_stats in src/stages.py for the figures and are not stored
      here.'
    columns:
      SITE: Site code
      IGBP: IGBP forest type of the site
      SCENARIO: 'Stage number within the sequence, 0 to 8 (factorial: cell number 0 to 15, 4 times SWC_CLASS
        plus VPD_CLASS)'
      CONDITION: Text label of the stage, not unique (stages 5, 6 and 7 are all labeled hot and driest),
        use SCENARIO as key
      N_VALUES: Number of records of the site in the stage (count), statistics are NaN when 0
      TA_CLASS: Temperature class of the stage, -1 unrestricted, 0 within plus or minus a, 1 above a up
        to b, 2 above b up to c, 3 above c
      VPD_CLASS: VPD class of the stage, 0 within plus or minus a, 1 above a up to b, 2 above b up to
        c, 3 above c, -1 unrestricted in stage 0 and only kept at or below c in stages 2 to 7
      SWC_CLASS: 'Soil water class of the stage, toward dry soil: 0 within plus or minus a, 1 below -a
        down to -b, 2 below -b down to -c, 3 below -c, -1 unrestricted in stage 0 and only kept at or
        above -c in mirrored stages 2 to 7'
      NET_SHAPVALS_OVR_AVG: Mean of SUM (net SHAP effect of all predictors) over the stage records at
        this site, in σ of the target, equals SUM_OVR_AVG
      NET_SHAPVALS_OVR_SD: Standard deviation (ddof 1) of SUM over the stage records at this site, in
        σ of the target, includes the covariance between drivers
      NET_SHAPVALS_OVR_SEM: Standard error of the mean of SUM over the stage records at this site, in
        σ of the target
      __index_level_0__: Written pandas index, the site code (same as SITE)
      EXPECTED: SHAP base value in σ of the target, mean over the folds of each fold explainer's expected
        model output, one constant per site file
      SUM: Sum of the {VAR}_ZSCORE_SHAPVALS columns of the record, in σ of the target
      SUM+EXPECTED: EXPECTED plus SUM, in σ of the target, reconstructs the prediction up to the difference
        between the fold's own base value and the fold mean (at most about 0.03 σ), use {VAR}_ZSCORE_PRED
        for the exact prediction
  outputs/40_aggregation/45_StageDistributions:
    row: 'perSite: one row per site and stress stage. overall: one row per stage. byIGBP: one row per
      stage and forest type'
    note: 'Three csv files in 40_aggregation/NEP_ZSCORE/conditional. Stages are the main sequence of
      src/stages.py, stage_0 to stage_8 (defined under 44 SHAP per stress stage), applied to the per-site
      conditional SHAP files. perSite holds the median over the records of one site
      in one stage. overall and byIGBP summarize these site medians across sites, each site with equal
      weight: the value columns are the median across sites and the _iqr columns the 25th and 75th percentiles
      across sites. A site enters a stage only if it has at least one record in it. VAR is TA, VPD, SWC
      or SWIN.'
    columns:
      SITE: FLUXNET site ID
      IGBP: IGBP forest type of the site (ENF, DBF, EBF, MF)
      stage: Stress stage index, 0 to 8, see note
      n_records: 'perSite: number of records of the site in the stage'
      '{VAR}_abs_median': 'perSite: median of measured VAR over the records of the site in the stage,
        in the unit of VAR in the subset files (TA °C, VPD hPa, SWC %, SWIN W m-2)'
      '{VAR}_z_median': 'perSite: median of VAR_ZSCORE over the records of the site in the stage, in σ
        of VAR'
      sites: 'overall and byIGBP: number of sites with at least one record in the stage (and forest type)'
      records: 'overall and byIGBP: sum of n_records over these sites'
      '{VAR}_z': 'overall and byIGBP: median across sites of the site medians of VAR_ZSCORE, in σ of VAR'
      '{VAR}_z_iqr': 'overall and byIGBP: text [q25, q75], 25th and 75th percentile across sites of the
        site medians of VAR_ZSCORE, in σ of VAR, rounded to 2 decimals'
      '{VAR}_abs': 'overall and byIGBP: median across sites of the site medians of measured VAR, in the
        unit of VAR in the subset files'
      '{VAR}_abs_iqr': 'overall and byIGBP: text [q25, q75], 25th and 75th percentile across sites of
        the site medians of measured VAR, rounded to 2 decimals'
  outputs/40_aggregation/46_ALE_SiteCurves:
    row: One row per site with an ALE curve for VPD_ZSCORE
    note: Parquet in 40_aggregation/NEP_ZSCORE/ale (main run) and ale/deep-sm.
      The raw accumulated local effects (ALE) curve of each site for VPD_ZSCORE from stage 32 (PyALE, centered
      so the record-weighted mean effect is zero) is linearly interpolated to a common grid of 50 evenly
      spaced VPD_ZSCORE values spanning the minimum to maximum feature value over all site curves. Values
      are the unsmoothed interpolated curve, NaN outside the VPD range of the site. The ALE comes from
      a separate XGBoost model of NEP_ZSCORE per site, not from the SHAP models.
    columns:
      SITE: FLUXNET site ID, written index
      IGBP: IGBP forest type of the site
      '{GRID_X}': ALE effect of VPD_ZSCORE on predicted NEP_ZSCORE at the grid value given by the column
        name (VPD in σ), in σ of NEP, NEP positive = net uptake, NaN outside the VPD range of the site
  outputs/40_aggregation/46_ALE_Thresholds:
    row: 'One row per group: all sites (mean of per-site crossings), all sites (pooled curve), then ENF,
      DBF, MF, EBF'
    note: 'csv in 40_aggregation/NEP_ZSCORE/ale and ale/deep-sm. Per site, the ALE curve on the common
      grid (46_ALE_SiteCurves) is smoothed with a fourth-order polynomial and its highest positive to
      negative zero crossing is taken. Sites with a fitted curve that never crosses are left out. Group thresholds
      are the mean of the per-site crossings, each site with equal weight. The pooled curve row is a different
      quantity: the crossing of the cross-site mean of the fitted curves, kept where at least half of
      the sites have data, and it has no interval. Script 47 reads the ALL SITES row for its ALE row.
      The deep-sm file was written by an earlier version of script 46 and has no sd and se columns. Numbers
      are written rounded to 3 decimals.'
    columns:
      feature: Feature of the ALE curve, VPD_ZSCORE
      target: Model target, NEP_ZSCORE
      method: Per-site zero-crossings, mean (mean of per-site crossings) or Pooled curve zero-crossing
        (crossing of the mean curve)
      group: ALL SITES, ALL SITES (pooled curve), or an IGBP forest type
      threshold: VPD threshold in σ of VPD (within-site z-score), mean across sites of the per-site crossings,
        or crossing of the pooled curve
      ci_lower: Lower bound of the 95% confidence interval of the mean of per-site crossings, t distribution,
        σ of VPD, empty for the pooled curve row
      ci_upper: Upper bound of the same 95% confidence interval, σ of VPD, empty for the pooled curve
        row
      sd: Standard deviation across sites of the per-site crossings (ddof 1), σ of VPD, between-site spread,
        empty for the pooled curve row
      se: Standard error of the mean of per-site crossings, σ of VPD, empty for the pooled curve row
      n_sites: 'Per-site rows: number of sites with a crossing that enter the mean. Pooled curve row:
        number of sites with an ALE curve'
      mode: Per-site curves or Single curve
  outputs/40_aggregation/47_THRESHOLD_Robustness:
    row: One row per robustness test of the VPD threshold, plus a final PUBLISHED REFERENCE row
    note: 'csv in 40_aggregation/NEP_ZSCORE/conditional. Estimator of every row unless stated: highest
      positive to negative crossing of a fourth-order polynomial fitted to the cross-site median VPD SHAP
      per TA by VPD bin cell (stage 41 per-site cell means, cells held by at least half the row''s sites),
      as for Figure 4. Rows differ in data (soil water depth runs, no_ta, blocked-cv), in site set (regions
      removed, minimum record length, matched sites) or in estimator (mean per bin, GAM, ALE, estimator
      sweep). σ to kPa: kPa = (mean of VPD_Z0 + z times mean of VPD_SD, both over the sites of the row)
      / 10, with the stage 21 site table of the run behind
      the row (deep-sm rows use the deep-sm table, no_ta and blocked-cv their own, all others the main
      run table), CD-Ygb VPD divided by 100 from Pa to hPa. Each row has two intervals in kPa: lower and
      upper, the crossings of the 95% prediction band of the fit (src.fit, for the GAM row the band of
      the spline), shown in the display items, and boot_lower and boot_upper, the 2.5th and 97.5th percentiles
      of the crossing over 2000 resamples of sites with replacement. lower_sigma and upper_sigma are lower
      and upper in σ. The three rows with a note hold another interval in all four kPa columns: ALE instead
      of SHAP the 95% confidence interval of the mean of per-site ALE crossings (46_ALE_Thresholds), Threshold
      estimator and Any one site removed the minimum and maximum over the sweep settings or the removals.
      An interval bound is NaN if the corresponding curve does not cross zero.'
    columns:
      group: 'Test block: Soil water depth, Model fitting, Site set, empty for the reference row'
      test: Name of the test, or PUBLISHED REFERENCE for the main analysis
      threshold_sigma: 'Threshold in σ of VPD (within-site z-score). ALE row: ALL SITES value of 46_ALE_Thresholds,
        rounded to 3 decimals. Estimator row: median over the sweep settings. Any one site removed row:
        the reference value'
      threshold_kpa: 'Threshold in kPa, converted with the site set and site table of the row. Estimator
        row: median over the settings. Any one site removed row: median over the removals'
      lower: 'Lower interval bound in kPa: crossing of the lower 95% prediction band in ordinary rows,
        otherwise the interval named in note'
      upper: 'Upper interval bound in kPa: crossing of the upper 95% prediction band in ordinary rows,
        otherwise the interval named in note'
      boot_lower: 2.5th percentile of the threshold over 2000 site bootstrap resamples, kPa. Equal to
        lower in the three rows with a note
      boot_upper: 97.5th percentile of the threshold over 2000 site bootstrap resamples, kPa. Equal to
        upper in the three rows with a note
      n_sites: 'Number of sites in the row''s site set. ALE row: sites with a per-site ALE crossing. Any
        one site removed row: the full set, each refit uses one site less'
      lower_sigma: 'Lower bound of the same interval as lower, in σ of VPD. Any one site removed row:
        kPa minimum converted back with the main run site table. ALE row: rounded to 3 decimals'
      upper_sigma: 'Upper bound of the same interval as upper, in σ of VPD. Any one site removed row:
        kPa maximum converted back with the main run site table. ALE row: rounded to 3 decimals'
      note: 'Empty for prediction band rows. Otherwise names the interval held in lower, upper, boot_lower,
        boot_upper: 95% confidence interval of the mean of per-site crossings, spread across settings,
        or range across single-site removals'
      shift_kpa: threshold_kpa minus the PUBLISHED REFERENCE threshold_kpa, kPa, positive = higher threshold
        than the reference, 0 in the reference row
  outputs/40_aggregation/47_THRESHOLD_EstimatorSweep + LeaveOneSiteOut:
    row: 'EstimatorSweep: one row per estimator setting (23). LeaveOneSiteOut: one row per site removed
      from the reference set (208)'
    note: 'Two csv files in 40_aggregation/NEP_ZSCORE/conditional. EstimatorSweep refits the threshold
      on the same all-sites curve as Figure 4 (42 file, cross-site median VPD SHAP and median VPD bin
      value per TA by VPD cell, cells with at least half of the sites), changing only the estimator: polynomial
      degree, LOWESS span, smoothing spline factor, coarser VPD bins (cells averaged into wider bins,
      quartic fit), and fitting range in VPD. Threshold is always the highest positive to negative crossing.
      LeaveOneSiteOut leaves out each reference site in turn, refits the reference estimator on the remaining
      sites and converts to kPa with their mean VPD statistics. Removals without a crossing are not
      written. The min, max and median of both files form the Threshold estimator and Any one site
      removed rows of 47_THRESHOLD_Robustness.'
    columns:
      family: 'EstimatorSweep: estimator family, polynomial, lowess, spline, bin width or fitting range'
      setting: 'EstimatorSweep: setting within the family (degree 2 to 6, frac 0.2 to 0.7, s factor 0.001
        to 0.1 times n times variance, bin width 0.1 to 0.5 σ, fitting range |x| <= 2.0 to 3.5 σ or full
        range)'
      threshold_z: 'EstimatorSweep: VPD threshold in σ of VPD (within-site z-score), NaN if the fit does
        not cross zero'
      note: 'EstimatorSweep: published choice for the quartic, number of bins for bin width rows, number
        of TA by VPD cells kept for fitting range rows, otherwise empty'
      site_removed: 'LeaveOneSiteOut: FLUXNET site ID of the site left out, written index'
      threshold_kpa: 'LeaveOneSiteOut: threshold in kPa from the remaining sites, converted with their
        mean VPD and standard deviation (main run site table)'
  outputs/40_aggregation/48_EXCEEDANCE:
    row: 'PerSite: one row per site. PerBiome: one row per forest type (ENF, DBF, EBF, MF) plus all'
    note: 'Two csv files in 40_aggregation/NEP_ZSCORE/conditional. Counts stage 21 subset half-hours (peak-season
      daytime, QC 0) with VPD and VPD_ZSCORE present, no model involved. VPD converted from hPa to kPa,
      CD-Ygb from Pa. All exceedance shares are percent (0 to 100) of half-hours of the site with VPD
      strictly above a threshold. Four thresholds: the PUBLISHED REFERENCE of 47_THRESHOLD_Robustness
      in kPa, the same in σ, the crossing of each site from 49_SiteThresholds in σ, and the median crossing
      of its forest type from 49_BiomeThresholds_Summary in σ. PerBiome statistics named site_
      are across sites with equal weight. pooled_pct is weighted by records. The all row covers all sites. Half-hours means records, which are hours at the 5 hourly sites.'
    columns:
      SITE: 'PerSite: FLUXNET site ID'
      IGBP: IGBP forest type, PerBiome also all
      n_records: 'Number of half-hours with VPD (PerSite: of the site, PerBiome: summed over the sites)'
      n_above: 'PerSite: number of half-hours with VPD above the reference threshold in kPa'
      vpd_mean_kpa: 'PerSite: mean VPD over the half-hours of the site, kPa'
      vpd_max_kpa: 'PerSite: maximum VPD over the half-hours of the site, kPa'
      above_published_kpa_pct: 'PerSite: percent of the half-hours of the site with VPD above the reference
        threshold in kPa'
      above_published_sigma_pct: 'PerSite: percent of the half-hours of the site with VPD_ZSCORE above the
        reference threshold in σ'
      above_own_threshold_pct: 'PerSite: percent of the half-hours of the site with VPD_ZSCORE above the
        crossing of the site, NaN if the site has none'
      own_threshold_z: 'PerSite: threshold of the site from 49_SiteThresholds, σ of VPD, NaN if none'
      above_biome_threshold_pct: 'PerSite: percent of the half-hours of the site with VPD_ZSCORE above the
        median crossing of its forest type'
      biome_threshold_z: Median per-site crossing of the forest type from 49_BiomeThresholds_Summary,
        σ of VPD, NaN in the PerBiome all row
      mean_excess_kpa: 'PerSite: mean of VPD minus the reference threshold over half-hours above it, kPa,
        0 if never above. PerBiome: median across sites of these site means'
      n_sites: 'PerBiome: number of sites'
      pooled_pct: 'PerBiome: percent of all half-hours of the group above the reference threshold in kPa,
        record weighted'
      site_median_pct: 'PerBiome: median across sites of above_published_kpa_pct'
      site_min_pct: 'PerBiome: minimum across sites of above_published_kpa_pct'
      site_max_pct: 'PerBiome: maximum across sites of above_published_kpa_pct'
      sigma_median_pct: 'PerBiome: median across sites of above_published_sigma_pct'
      own_threshold_median_pct: 'PerBiome: median across sites with a crossing of above_own_threshold_pct'
      biome_threshold_median_pct: 'PerBiome: median across sites of above_biome_threshold_pct'
  outputs/40_aggregation/49_SiteThresholds + BiomeThresholds:
    row: 'SiteThresholds: one row per site with a crossing. Summary: one row per forest type. PairwiseTests:
      one row per pair of forest types (6)'
    note: Three csv files per run, in 40_aggregation/NEP_ZSCORE/conditional and its variant folders blocked-cv,
      deep-sm, deeper-only (main run, 128 sites that moved to a deeper soil layer) and deep-sm/deeper-only,
      each from that run's stage 41 TA by VPD file. Per site, the cell means of VPD SHAP are averaged
      per VPD bin over TA bins, a fourth-order polynomial is fitted and its highest positive to negative
      crossing taken. Sites with fewer than 15 VPD bins or without a crossing are left out. Summary and
      PairwiseTests use these per-site values, each site with equal weight. The Kruskal-Wallis test across
      the four forest types is only printed to the console, not written.
    columns:
      SITE: 'SiteThresholds: FLUXNET site ID'
      IGBP: IGBP forest type (ENF, DBF, EBF, MF)
      threshold_z: 'SiteThresholds: VPD threshold of the site in σ of its VPD (within-site z-score)'
      n: 'Summary: number of sites of the forest type with a crossing'
      median: 'Summary: median of the per-site thresholds, σ of VPD'
      iqr_lower: 'Summary: 25th percentile of the per-site thresholds, σ of VPD'
      iqr_upper: 'Summary: 75th percentile of the per-site thresholds, σ of VPD'
      ci_lower: 'Summary: 2.5th percentile of the median over 10000 bootstrap resamples of sites, σ of
        VPD'
      ci_upper: 'Summary: 97.5th percentile of the median over 10000 bootstrap resamples of sites, σ of
        VPD'
      pair: 'PairwiseTests: the two forest types compared, as A vs B'
      p_raw: 'PairwiseTests: p value of the two-sided Mann-Whitney U test of the per-site thresholds'
      p_holm: 'PairwiseTests: p value with Holm correction over the 6 pairs'
      significant: 'PairwiseTests: True if p_holm < 0.05'
  outputs/50_plots/51_FIG-1:
    row: One row per site of the analysis (208 sites, DNF and US-xBN excluded)
    note: Source Data of Fig. 1 and Supplementary Table 1.
      Panel a plots LON and LAT, panel b plots ERA5_MAP_1991_2020 (y) against ERA5_MAT_1991_2020 (x). Values copied
      from 10_datasets/17_datasets_info_parquet_vars_stats_usedsites_era5.csv (script 17). Column names
      have the ERA5 prefix whatever the source. Climate values describe the sites and enter no analysis
    columns:
      SITE: Site ID (FLUXNET style, country code and site code)
      IGBP: IGBP forest type of the site (ENF, DBF, MF or EBF)
      LAT: Site latitude in decimal degrees (WGS84), y axis of panel a
      LON: Site longitude in decimal degrees (WGS84), x axis of panel a
      ERA5_MAT_1991_2020: Mean annual air temperature 1991 to 2020 in °C, mean of the yearly values, x
        axis of panel b. Source in ERA5_MAT_SOURCE
      ERA5_MAP_1991_2020: Mean annual precipitation 1991 to 2020 in mm per year, mean of the yearly sums,
        y axis of panel b. Source in ERA5_MAP_SOURCE
      ERA5_MAT_SOURCE: 'Source of the MAT value: ''FLUXNET TA_ERA'' (ERA5 air temperature scaled to the
        site by ONEFlux, from the ERA5 file of the flux product) or ''ERA5-Land'' (ERA5-Land at the site
        coordinates)'
      ERA5_MAT_REASON: Why MAT comes from ERA5-Land, empty when the flux product value is used (no ERA5
        file in the flux product, or a hand-set override with its reason)
      ERA5_MAP_SOURCE: 'Source of the MAP value: ''FLUXNET P_ERA'' (ERA5 precipitation of the flux product)
        or ''ERA5-Land'''
      ERA5_MAP_REASON: Why MAP comes from ERA5-Land, empty when P_ERA is used (no ERA5 file, no site precipitation,
        P_ERA not scaled, P_ERA more than 25% off the site-reported MAP and ERA5-Land closer to it, with the source of that MAP,
        or a hand-set override)
  outputs/50_plots/52_FIG-2:
    row: One row per cell of a two-variable bin grid and panel (15 panels a to o)
    note: 'Source Data of Fig. 2. Each panel is a heat map: x and y are the bin coordinates,
      z the color. Rows of panels: TA by VPD (a to e), SM by VPD (f to j), ET by VPD (k to o). Columns
      of panels: Global forests, ENF, DBF, MF, EBF. Bins are 0.1 σ wide and labeled by their lower edge.
      Per site, the VPD SHAP values of all records in a cell are averaged (stage 41), then z is the mean
      of these site means across the sites of the group, equal weight per site (stages 42 and 43). A cell
      is kept only if at least half of the sites of the group have data in it, and a forest type panel
      excludes cells that are missing from the Global forests panel. The site count per panel shown
      in the figure header is not in the file. The deep-sm and deeper-only folders hold
      the figure only, no csv'
    columns:
      panel: Panel letter of the figure, a to o
      group: 'Site group of the panel: ''Global forests'' (all sites) or a forest type (ENF, DBF, MF,
        EBF)'
      x_var: 'Name of the bin column on the x axis: BIN_TA_ZSCORE, BIN_SWC_ZSCORE or BIN_ET_ZSCORE'
      y_var: Name of the bin column on the y axis, always BIN_VPD_ZSCORE
      z_var: Name of the plotted statistic, VPD_ZSCORE_SHAPVALS_mean (mean across sites of the site mean
        VPD SHAP value in the cell)
      x: Lower edge of the x bin in σ (z-score of x_var within site)
      y: Lower edge of the VPD bin in σ (VPD z-score within site)
      z: VPD effect on daytime NEP in σ of NEP, mean across the sites of the group of the site mean SHAP
        value of VPD in the cell
  outputs/50_plots/52_SUPPFIG-1:
    row: One row per cell of a two-variable bin grid and panel (10 panels a to j)
    note: 'Source Data of Supplementary Fig. 1. Same layout and aggregation as
      Fig. 2: panels a to e show the TA effect on the TA by VPD grid, panels f to j the SM effect on the
      SM by VPD grid, columns Global forests, ENF, DBF, MF, EBF. Bins 0.1 σ wide, labeled by their lower
      edge. z is the mean across sites of the per-site mean SHAP value in the cell. Cells kept only where
      at least half of the sites of the group have data, forest type panels only where the Global forests
      panel has the cell'
    columns:
      panel: Panel letter of the figure, a to j
      group: 'Site group of the panel: ''Global forests'' (all sites) or a forest type (ENF, DBF, MF,
        EBF)'
      x_var: 'Name of the bin column on the x axis: BIN_TA_ZSCORE or BIN_SWC_ZSCORE'
      y_var: Name of the bin column on the y axis, always BIN_VPD_ZSCORE
      z_var: 'Name of the plotted statistic: TA_ZSCORE_SHAPVALS_mean or SWC_ZSCORE_SHAPVALS_mean'
      x: Lower edge of the x bin in σ (z-score of x_var within site)
      y: Lower edge of the VPD bin in σ (VPD z-score within site)
      z: TA or SM effect on daytime NEP in σ of NEP, mean across the sites of the group of the site mean
        SHAP value in the cell
  outputs/50_plots/52_SUPPFIG-7:
    row: One row per cell of the SM by VPD bin grid and panel (20 panels a to t)
    note: 'Source Data of Supplementary Fig. 7. The fluxes themselves, not SHAP
      values, on the SM by VPD grid: panels a to e NEP, f to j GPP, k to o RECO, p to t ET, columns Global
      forests, ENF, DBF, MF, EBF. Bins 0.1 σ wide, labeled by their lower edge. z is the mean across sites
      of the per-site mean flux z-score in the cell. Cells kept only where at least half of the sites
      of the group have data, forest type panels only where the Global forests panel has the cell'
    columns:
      panel: Panel letter of the figure, a to t
      group: 'Site group of the panel: ''Global forests'' (all sites) or a forest type (ENF, DBF, MF,
        EBF)'
      x_var: Name of the bin column on the x axis, always BIN_SWC_ZSCORE
      y_var: Name of the bin column on the y axis, always BIN_VPD_ZSCORE
      z_var: 'Name of the plotted statistic: NEP_ZSCORE_mean, GPP_ZSCORE_mean, RECO_ZSCORE_mean or ET_ZSCORE_mean'
      x: Lower edge of the SM bin in σ (soil water z-score within site)
      y: Lower edge of the VPD bin in σ (VPD z-score within site)
      z: Flux in σ of that flux (z-score within site), mean across the sites of the group of the site
        mean in the cell. Positive NEP is net CO2 uptake
  outputs/50_plots/53_FIG-3:
    row: One row per driver (or net effect), site group and stage
    note: Source Data of Fig. 3 is the NEP file in the base folder. Read from the stage 44 file,
      which holds per site and stage the mean over the records of that stage of each SHAP value. All statistics
      are taken across sites, equal weight per site. Panel a is igbp = global, panels b to e the forest
      types. Bars are the mean of the drivers, the diamond the mean of NET_SHAPVALS with its sem as whisker. The driver bars have no whiskers.
      The GPP, RECO and ET files give the same for models of that flux (effects in σ of that flux), the
      deep-sm and deeper-only files the sensitivity runs
    columns:
      Variable: 'Driver: {VAR}_ZSCORE_SHAPVALS_OVR_AVG for SWIN, TA, SWC (SM) and VPD (site stage mean
        SHAP value of that predictor), or NET_SHAPVALS (site stage mean of the sum of the four SHAP values,
        the net effect)'
      igbp: 'Site group: ''global'' (all sites, panel a) or a forest type ENF, DBF, MF, EBF (panels b
        to e)'
      stage: Stress stage 1 to 8 (definitions in Supplementary Table 3)
      mean: Mean across sites of the site stage mean effect, in σ of the flux (bar height or net diamond)
      sem: Standard error of that mean across sites (std of site means divided by the square root of n_sites),
        in σ, drawn as whisker for NET_SHAPVALS only
      total_sd: 'Total standard deviation in σ by the law of total variance: square root of the mean within-site
        variance of the record SHAP values plus the variance of the site means (ddof 0)'
      min: Smallest site stage mean in σ
      max: Largest site stage mean in σ
      n_sites: Number of sites with records in this stage
  outputs/50_plots/53_SUPPFIG-3:
    row: One row per driver (or net effect), site group and stage
    note: 'Source Data of Supplementary Fig. 3. Same columns and statistics as
      Fig. 3 data, from the mirrored-stages aggregation: VPD rises along the stages while soil water is
      only kept off its extreme (SWC z ≥ -1.28), and Stage 8 adds extreme soil dryness. All statistics across sites, equal weight per site'
    columns:
      Variable: 'Driver: {VAR}_ZSCORE_SHAPVALS_OVR_AVG for SWIN, TA, SWC (SM) and VPD (site stage mean
        SHAP value of that predictor), or NET_SHAPVALS (site stage mean of the sum of the four SHAP values)'
      igbp: 'Site group: ''global'' (all sites) or a forest type ENF, DBF, MF, EBF'
      stage: Stage 1 to 8 of the mirrored sequence
      mean: Mean across sites of the site stage mean effect, in σ of NEP
      sem: Standard error of that mean across sites, in σ
      total_sd: 'Total standard deviation in σ: square root of the mean within-site variance plus the
        variance of the site means (ddof 0)'
      min: Smallest site stage mean in σ
      max: Largest site stage mean in σ
      n_sites: Number of sites with records in this stage
  outputs/50_plots/54_FIG-4:
    row: 'Data files: one row per cell of the TA by VPD bin grid kept for the panel. Several rows share
      one VPD bin. Coefficient file: one row per panel'
    note: 'Source Data of Fig. 4. Two schemas: the _ALLSITES_DATA and _<IGBP>_DATA files (points
      of panel a and panels b to e) and the _DATA_COEFFICIENTS file (fits). Grid: TA and VPD bins 0.1
      σ wide, labeled by their lower edge. Per site, all records in a cell are averaged (stage 41), then
      the site values are aggregated across sites, equal weight per site (stages 42 and 43). The all-sites
      file holds cells where at least half of the sites of the run have data (104 of 208 in the main analysis). A forest type file holds cells
      that are also in the all-sites file and where at least half of the sites of that type have data,
      and leaves out rows with a missing value. Each point is plotted at x = BIN_VPD_ZSCORE_median, y = VPD_ZSCORE_SHAPVALS_median,
      colored by TA_ZSCORE_mean in ten equal-width classes.
      The variant folders (deep-sm, blocked-cv, deeper-only and deep-sm/deeper-only) and the GPP, RECO
      and ET folders hold the same files for those runs, with SHAP values in σ of their flux'
    columns:
      BIN_VPD_ZSCORE_median: Lower edge of the VPD bin in σ (VPD z-score within site), x axis. The median
        across sites is used only to read the bin label exactly, all sites share it
      VPD_ZSCORE_SHAPVALS_median: 'VPD effect on daytime NEP in σ of NEP, y axis: median across sites
        of the site mean VPD SHAP value in the cell'
      TA_ZSCORE_mean: 'Air temperature of the cell in σ (TA z-score within site), point color: mean across
        sites of the site mean TA z-score in the cell'
      VPD_ZSCORE_SHAPVALS_sem: 'Standard error across sites of the site mean VPD SHAP values in the cell,
        in σ of NEP: std across sites divided by the square root of the number of sites with data,
        around the cross-site mean (y is the median). Not drawn, it sets the y range of the panels'
      VPD_ZSCORE_SHAPVALS_median_se: 'Standard error of the cross-site median VPD SHAP value in the cell,
        in σ of NEP: standard deviation of the median over 1,000 bootstrap resamples of the sites
        (seed 42), from the per-site cell means of stage 41, all sites in the all-sites file and the sites
        of the forest type in its file. Error bars of the panel'
      IGBP: 'Panel of the fit: ''ALL SITES'' (panel a) or a forest type ENF, DBF, MF, EBF (panels b to
        e)'
      a: Coefficient of x^4 of the fourth-order polynomial y = a x^4 + b x^3 + c x^2 + d x + e, fitted
        by least squares to the cells of the panel (x VPD bin in σ, y median VPD SHAP in σ)
      b: Coefficient of x^3 of the same polynomial
      c: Coefficient of x^2 of the same polynomial
      d: Coefficient of x of the same polynomial
      e: Constant term of the same polynomial, in σ
      R2: Coefficient of determination of the fit over the cells of the panel, each cell weighted equally,
        1 minus residual over total sum of squares
      Threshold: 'VPD threshold in σ (not kPa) as text ''t [lo, hi]'': t is the highest positive to negative
        zero crossing of the fit, lo and hi the same crossing of the lower and upper bound of the 95%
        prediction interval. kPa values are in Supplementary Table 7'
  outputs/50_plots/54_SUPPTABLE-7:
    row: 'One row per site group: all sites, then ENF, DBF, MF, EBF'
    note: Source Data of Supplementary Table 7. Same fits as the Fig. 4 coefficient
      file, written by the same script
    columns:
      Group: 'Site group: ''ALL SITES'' or a forest type ENF, DBF, MF, EBF'
      Sites: Number of sites of the group in the stage 21 subsets table
      a: Coefficient of x^4 of y = a x^4 + b x^3 + c x^2 + d x + e, x VPD in σ, y VPD effect on NEP in
        σ
      b: Coefficient of x^3
      c: Coefficient of x^2
      d: Coefficient of x
      e: Constant term, in σ
      R2: Coefficient of determination of the fit over the grid cells, rounded to 3 decimals
      Threshold (sigma): 'Threshold in σ as text ''t [lo, hi]'': highest positive to negative zero crossing
        of the fit, and of the lower and upper 95% prediction bound'
      Threshold (kPa): 'The same three values in kPa as text ''t [lo, hi]'': per site VPD mean plus z
        times VPD standard deviation (subset records, hPa, CD-Ygb converted from Pa), divided by 10, then
        averaged over the sites of the group'
  outputs/50_plots/55_TABLE-1:
    row: One row for the main analysis, then one row per test shown in Table 1 (15 of the 18 tests), with sub-header rows for the test groups
    note: 'Source Data of Table 1. Formatted table built from 40_aggregation 47_THRESHOLD_Robustness_NEP_ZSCORE.csv,
      which holds the unformatted numbers of all 18 tests. Rows ''Soil water depth'', ''Model fitting''
      and ''Site set'' are group headers with empty cells. Values are text ''t [lo, hi]'': lo and hi are
      the 95% prediction band of the fit, except in rows marked with an asterisk, where they are the range
      across the leave-one-site-out removals or, for ALE, the 95% confidence interval of the mean per-site
      crossing. The .xlsx twin (sheet ''Table 1'') is the same table for Word with the footnote under
      it and is not described separately'
    columns:
      Test: Name of the robustness test, or of the test group in a sub-header row
      Sites (of 208): Number of sites in the run of this test, empty in sub-header rows
      Threshold (σ): VPD threshold in σ (VPD z-score within site) with its interval, text
      Threshold (kPa): VPD threshold in kPa with its interval, text, converted with the site set of the
        row (per-site VPD mean and standard deviation averaged over the sites of the run)
  outputs/50_plots/56_SUPPTABLE-6:
    row: One row per site group, driver and stage
    note: Source Data of Supplementary Table 6. Supplementary Fig. 2 plots the per-site values of stage 44
      (SupplementaryFig2.csv) and draws Mean, n_sites and PERC_N_SITES_BELOW_ZERO from this file. Per site and stage, the stage 44 file holds the mean over the records of that stage of each SHAP
      value. All statistics here are taken across the sites of the group, equal weight per site, in σ
      of NEP. This csv holds the four drivers only. The net sum rows and the block for all sites with
      the deepest soil water layer (deep-sm run) are only in the .xlsx, which is the formatted table for
      Word (cells 'mean±total_SD (min, max)') and is not described separately
    columns:
      IGBP: 'Site group: ''All sites'' or a forest type ENF, DBF, MF, EBF'
      Feature: 'Driver, as the stage 44 column: {VAR}_ZSCORE_SHAPVALS_OVR_AVG for VPD, TA, SWC (SM) and
        SWIN (SW), the site stage mean SHAP value of that predictor'
      n_sites: Number of sites with records in this stage
      Scenario: Stress stage 1 to 8 (definitions in Supplementary Table 3)
      Mean: Mean across sites of the site stage mean effect, in σ
      total_SD: 'Total standard deviation in σ: square root of the mean within-site variance of the record
        SHAP values plus the variance of the site means (ddof 0)'
      SEM: Standard error of the mean across sites, in σ
      Median: Median across sites of the site stage mean effect, in σ
      Min: Smallest site stage mean in σ
      Max: Largest site stage mean in σ
      P25: 25th percentile across sites, in σ
      P75: 75th percentile across sites, in σ
      Sites < 0: Number of sites with a negative site stage mean effect
      '% < 0': Share of sites with a negative site stage mean effect, in %
      PERC_N_SITES_BELOW_ZERO: Same as '% < 0', in %, the value printed in a label at the bottom of each stage column
  outputs/50_plots/57_SUPPFIG-5:
    row: 'Curves file: one row per site, grid point and panel. Thresholds file: one row per site group'
    note: Source Data of Supplementary Fig. 5.
      ALE (accumulated local effects, PyALE) of VPD on the NEP model of each site, interpolated by stage
      46 to one grid of 50 points spanning all sites, then smoothed per site with a fourth-order polynomial.
      Grid points outside the VPD range of the site are left out. Each site appears twice in the curves file,
      in panel a and in the panel of its forest type
    columns:
      panel: 'Panel letter: a (all sites) or b to e (ENF, DBF, MF, EBF)'
      group: 'Site group: ''Global forests'' or a forest type ENF, DBF, MF, EBF'
      SITE: Site ID
      IGBP: IGBP forest type of the site
      x: VPD in σ (VPD z-score within site), grid point of the common grid
      ale_effect: Polynomial-smoothed ALE of VPD on predicted NEP at x, in σ of NEP
      threshold: 'ALE threshold in σ: mean across the sites of the group of the highest positive to negative
        zero crossing of each smoothed site curve, sites without a crossing left out'
      n_crossing: Number of sites of the group with a positive to negative zero crossing of the curve
      n_total: Number of sites of the group
      ci95_lower: Lower bound of the 95% confidence interval of the threshold in σ, from the t distribution
        over the site crossings
      ci95_upper: Upper bound of the 95% confidence interval of the threshold in σ
  outputs/50_plots/58_SUPPFIG-6:
    row: 'Curves file: one row per flux and point of the fitted curve (1000 per flux). Thresholds file:
      one row per flux'
    note: Source Data of Supplementary Fig. 6.
      For each flux the all-sites cells of the TA by VPD grid are read and fitted as in Fig. 4 (median
      across sites of the site mean VPD SHAP per cell, fourth-order polynomial, 95% prediction interval).
      The NEP curve is the Fig. 4a curve. The kPa scale is the mean over sites of the site VPD means
      plus z times the mean over sites of the site VPD standard deviations (subset records, CD-Ygb converted
      from Pa)
    columns:
      flux: 'Flux of the model: NEP, GPP, RECO or ET'
      vpd_z: VPD in σ (VPD z-score within site), evenly spaced between the lowest and highest VPD bin
        of the cells
      vpd_kpa_network: The same VPD in kPa on the scale described in the note (means over the sites), top axis of the figure
      effect_z: Fitted VPD effect on the flux in σ of that flux. Positive is more of the flux (more net CO2 uptake
        for NEP, more GPP, more respiration for RECO, more water loss for ET)
      band_lower: Lower bound of the 95% prediction interval of the fit, in σ of the flux
      band_upper: Upper bound of the 95% prediction interval of the fit, in σ of the flux
      source: 'Origin of the flux: ''measured'' (NEP), ''partitioned'' (GPP, RECO) or ''from gap-filled
        latent heat flux'' (ET)'
      n_sites: Number of sites in the all-sites aggregation of the flux
      fit_r2: Coefficient of determination of the polynomial fit over the cells, rounded to 3 decimals
      threshold_z: Highest positive to negative zero crossing of the fit, in σ of VPD
      lower_z: Same crossing of the lower prediction bound in σ, empty if that bound does not cross
      upper_z: Same crossing of the upper prediction bound in σ, empty if that bound does not cross
      threshold_kpa_network: threshold_z in kPa on the scale of vpd_kpa_network
      marked_in_figure: True if the crossing is drawn in the figure (filled marker, or open marker for
        a crossing that is not resolved)
      note: Remark on the crossing, empty or 'interval open on one side, crossing not resolved' (RECO)
  outputs/50_plots/59_SUPPTABLE-4:
    row: One row per site group and stage (stages 0 to 8, for Global forests and each forest type)
    note: 'Source Data of Supplementary Table 4. Built from stage 45: per site
