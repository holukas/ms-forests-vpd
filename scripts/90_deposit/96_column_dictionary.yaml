  outputs/50_plots/69_SUPPTABLE-10:
    row: One row per cell of soil water class by VPD class, 16 cells, in both csv files
    note: 'Source Data of Supplementary Table 10. The classes
      use the stage cut-offs a = 0.3186, b = 0.7144 and c = 1.2816 σ, soil water stepping downward and
      VPD upward from the central class, TA unrestricted. A site enters a cell when it has at least one
      record there. Per site, the SHAP values are averaged over the records of the cell (σ of the within-site
      NEP z-score), then the statistics are taken across sites, equal weight per site. The net effect
      is the per-record sum of the SHAP values of TA, VPD, SWC and SWIN. In the table csv the effect cells
      are text, the mean across sites with the 25th and 75th percentiles across sites in brackets, two
      decimals. In the DATA csv, SWC_ZSCORE_* and VPD_ZSCORE_* name the predictor: they hold the SHAP
      values of SWC_ZSCORE and VPD_ZSCORE (script 69 removes the suffix _SHAPVALS_OVR_AVG of the stage 44
      columns).'
    columns:
      SM class: Soil water class with its SWC z-score range, as text
      VPD class: VPD class with its VPD z-score range, as text
      Sites: Number of sites with at least one record in the cell, count
      Records: Records in the cell summed over sites, count
      SM effect (σ): Soil water SHAP contribution, mean across sites of site means with interquartile
        range across sites in brackets, in σ, text
      VPD effect (σ): VPD SHAP contribution, mean across sites of site means with interquartile range
        across sites in brackets, in σ, text
      Net effect (σ): Sum of the four SHAP contributions, mean across sites of site means with interquartile
        range across sites in brackets, in σ, text
      SWC_CLASS: 'Soil water class index: 0 central (|z| ≤ a), 1 dry (-b ≤ z < -a), 2 very dry (-c ≤ z
        < -b), 3 extreme (z < -c)'
      VPD_CLASS: 'VPD class index: 0 central (|z| ≤ a), 1 higher (a < z ≤ b), 2 high (b < z ≤ c), 3 extreme
        (z > c)'
      SWC_CLASS_NAME: 'Name of the soil water class: central, dry, very dry, extreme'
      VPD_CLASS_NAME: 'Name of the VPD class: central, higher, high, extreme'
      sites: Number of sites with at least one record in the cell, count
      records: Records in the cell summed over sites, count
      SWC_ZSCORE_mean: Mean across sites of the site mean soil water SHAP contribution in the cell, in
        σ
      SWC_ZSCORE_median: Median across sites of the site mean soil water SHAP contribution in the cell,
        in σ
      SWC_ZSCORE_q25: 25th percentile across sites of the site mean soil water SHAP contribution in the
        cell, in σ
      SWC_ZSCORE_q75: 75th percentile across sites of the site mean soil water SHAP contribution in the
        cell, in σ
      VPD_ZSCORE_mean: Mean across sites of the site mean VPD SHAP contribution in the cell, in σ
      VPD_ZSCORE_median: Median across sites of the site mean VPD SHAP contribution in the cell, in σ
      VPD_ZSCORE_q25: 25th percentile across sites of the site mean VPD SHAP contribution in the cell,
        in σ
      VPD_ZSCORE_q75: 75th percentile across sites of the site mean VPD SHAP contribution in the cell,
        in σ
      NET_mean: Mean across sites of the site mean net effect in the cell, in σ
      NET_median: Median across sites of the site mean net effect in the cell, in σ
      NET_q25: 25th percentile across sites of the site mean net effect in the cell, in σ
      NET_q75: 75th percentile across sites of the site mean net effect in the cell, in σ
  outputs/80_info/80_INFO_TimeScaleCoverage:
    row: 'DailyCoverage: one row per summary quantity. DailyCoverage_perSite: one row per site. TimeScaleSampleSize:
      one row per time scale'
    note: 'Numbers on why the analysis is not repeated at daily or coarser resolution, 208 sites. Daily
      coverage counts the analysis window before the quality filter: the four peak-GPP months of the site,
      daytime records (SW_IN_POT > 20 W m-2), all years. A record is measured when its NEE QC flag is
      0. Sample size per time scale uses the modeled subsets (measured, daytime, peak months, year-balanced,
      complete cases), averaged to days (days with at least 8 records), to the calendar months of each
      year and to years. At the coarser scales the means are standardized again per site (population standard
      deviation) before the Stage 8 rule of src/stages.py is applied. DailyCoverage is a long table of
      quantity and value.'
    columns:
      quantity: 'Name of the summary quantity: sites (count), daytime_per_day_median_site and measured_per_day_median_site
        (median across sites of the site median daytime and measured records per day), measured_share_pct_median_site
        (median across sites of the measured share, %), sites_median_day_unmeasured (sites with a median
        of 0 measured records per day), days_ge90pct_measured_pct_median_site and the 75 and 50 twins (median
        across sites of the percent of days with at least that share measured), days_ge90pct_measured_pct_pooled
        and the 75 and 50 twins (same percent over all site days pooled)'
      value: Value of the quantity, unit as named in quantity
      SITE: FLUXNET site code
      IGBP: IGBP forest type of the site
      days: Number of peak-season days with at least one daytime record, all years, count
      daytime_per_day_median: Median over days of the daytime records per day, count
      measured_per_day_median: Median over days of the measured records per day, count
      measured_share_pct: Measured records as percent of daytime records, pooled over all days of the
        site
      days_ge90pct_measured: Number of days with at least 90 % of the daytime records measured
      days_ge90pct_measured_pct: Days with at least 90 % measured, as percent of days
      days_ge75pct_measured: Number of days with at least 75 % of the daytime records measured
      days_ge75pct_measured_pct: Days with at least 75 % measured, as percent of days
      days_ge50pct_measured: Number of days with at least 50 % of the daytime records measured
      days_ge50pct_measured_pct: Days with at least 50 % measured, as percent of days
      scale: 'Time scale: half-hourly, daily, monthly, yearly'
      records: 'Values at that scale summed over sites: records, days, site months or site years, count'
      median_per_site: Median across sites of the values per site at that scale
      stage8_records: Values at that scale in Stage 8, summed over sites, count
      sites_without_stage8: Number of sites with no Stage 8 value at that scale
      sites_with_ge100_records: Number of sites with at least 100 values at that scale
  outputs/80_info/81_INFO_ThresholdDefinitions:
    row: 'One row per group: all sites and the forest types ENF, DBF, EBF, MF'
    note: Four points on the quartic fit of the Fig. 4 VPD response curve of the group (VPD SHAP value
      in σ of NEP against the VPD z-score bin, from the 54_FIG-4 _DATA files), fit evaluated at 2000 points
      over the fitted range. z values are in σ of the VPD z-score. kPa values are the mean over the sites
      of the group, equal weight per site, of (site mean VPD + z × site VPD standard deviation) / 10,
      with CD-Ygb converted from Pa to hPa. An edge flag is True when the point lies within 2 % of the
      fitted range width from either end. Feeds Supplementary Table 9.
    columns:
      group: ALL SITES or IGBP forest type
      x_max: Largest VPD z-score bin of the fitted curve data, upper end of the fitted range, in σ
      peak_z: VPD z-score where the fitted VPD effect is most positive, in σ
      peak_kPa: Peak converted to VPD in kPa
      peak_at_edge: True if the peak lies at the edge of the fitted range
      steepest_decline_z: VPD z-score of the most negative slope of the fitted curve at or after the peak,
        in σ
      steepest_decline_kPa: Steepest decline converted to VPD in kPa
      steepest_decline_at_edge: True if the steepest decline lies at the edge of the fitted range
      zero_crossing_z: VPD z-score of the highest crossing of the fitted curve from positive to negative,
        the threshold, linearly interpolated, in σ, empty without crossing
      zero_crossing_kPa: Zero crossing converted to VPD in kPa
      zero_crossing_at_edge: Always False, the zero crossing is not tested for the range edge
      minimum_z: VPD z-score where the fitted VPD effect is most negative within the fitted range, in
        σ
      minimum_kPa: Minimum converted to VPD in kPa
      minimum_at_edge: True if the minimum lies at the edge of the fitted range
  outputs/80_info/82_INFO_ThresholdVsSiteVPDRange:
    row: 'ThresholdVsSiteVPDRange: one row per quartile of site maximum VPD. _perSite: one row per site,
      208 sites'
    note: Tests whether the per-site threshold follows the VPD range of the site. The per-site threshold
      is the highest positive to negative crossing of a quartic fitted to the site VPD response (49_SiteThresholds.csv).
      The site maximum VPD is taken over the modeled records. Medians are across sites, equal weight per
      site, and sites without a crossing are left out of the threshold medians. CD-Ygb is converted from
      Pa to hPa. Feeds Supplementary Table 8.
    columns:
      stratum: 'Quartile of site maximum VPD: Q1 lowest max VPD, Q2, Q3, Q4 highest max VPD'
      n: Number of sites in the quartile, count
      median_max_vpd_kpa: Median across the sites of the quartile of the site maximum VPD, in kPa
      median_threshold_sigma: Median across sites with a crossing of the per-site threshold, in σ of the
        VPD z-score
      median_threshold_kpa: Median across sites with a crossing of the per-site threshold, in kPa
      sites_with_crossing: Number of sites of the quartile with a zero crossing, count
      SITE: FLUXNET site code
      IGBP: IGBP forest type of the site
      threshold_z: Per-site threshold in σ of the VPD z-score, empty without crossing
      threshold_kpa: Per-site threshold in kPa, (site mean VPD + threshold_z × site VPD standard deviation)
        / 10
      vpd_max_kpa: Maximum VPD of the site over the modeled records, in kPa
  outputs/80_info/82_INFO_DriverEffectDirection:
    row: One row per site and driver with at least 15 usable bins
    note: Direction of each driver's effect against the driver itself, per site. The SHAP values of the
      driver are averaged per 0.1 σ bin of the driver z-score (bin center = z rounded to the nearest 0.1).
      Bins with fewer than 10 records are left out.
    columns:
      SITE: FLUXNET site code
      driver: 'Driver: VPD, TA, SWIN or SWC'
      bins: Number of 0.1 σ bins with at least 10 records, count
      r: Pearson correlation across bins between bin center and mean SHAP value of the driver, negative
        means the effect falls as the driver rises
  outputs/80_info/83_INFO_LeaveRegionOut:
    row: 'One row per site set: all sites, minus Europe, minus North America, minus both'
    note: Region from the country prefix of the site code. Thresholds are the per-site thresholds of script
      49, not the crossing of the aggregated curve of Table 1. Stage 8 values are the site means of the
      SHAP contributions over the Stage 8 records (script 44). Nothing is refitted. CD-Ygb is converted
      from Pa to hPa.
    columns:
      set: 'Site set: all sites, minus Europe, minus North America, minus both'
      sites: Number of sites of the set with a per-site threshold, count
      stage8_sites: Number of sites of the set with Stage 8 records, count
      ratio: Mean across sites of the Stage 8 VPD SHAP contribution divided by the mean across sites of
        the Stage 8 soil water SHAP contribution, unitless
      threshold_sigma: Median over the sites of the set of the per-site threshold, in σ of the VPD z-score
      threshold_kpa: Median over the sites of the set of the per-site threshold in kPa,
        (site mean VPD + threshold × site VPD standard deviation) / 10
  outputs/80_info/84_INFO_ShortRecordSensitivity:
    row: 'One row per minimum record length: 1, 2, 3, 5 and 10 years'
    note: Record length is N_YEARS of the modeled subset, last minus first calendar year plus 1. Thresholds
      are the per-site thresholds of script 49, not the crossing of the aggregated curve of Table 1. Nothing
      is refitted. CD-Ygb is converted from Pa to hPa.
    columns:
      min_years: Minimum record length of a site, in years
      sites: Number of sites with a per-site threshold and at least min_years, count
      records_kept_pct: Modeled records of the sites with at least min_years, as percent of the modeled
        records of all sites
      threshold_sigma: Median over the kept sites of the per-site threshold, in σ of the VPD z-score
      threshold_kpa: Median over the kept sites of the per-site threshold, in kPa
      ratio: Mean across kept sites of the Stage 8 VPD SHAP contribution divided by the mean across kept
        sites of the Stage 8 soil water SHAP contribution, unitless
  outputs/80_info/85_INFO_WueVsVpd:
    row: 'acrossSites: one row per VPD bin reached by at least half the sites. exponents: one row per
      site with at least 8 usable bins. perSite: one row per site and VPD bin'
    note: Water use efficiency (WUE) from the flux data against VPD, no SHAP values. GPP is partitioned, ET derived from the latent heat flux. Bins are 0.1 σ wide on the
      VPD z-score of the modeled records and labeled by their lower edge. Per bin WUE is mean GPP over
      mean ET, converted with 15.42 mmol H2O m-2 s-1 per mm h-1, in µmol CO2 per mmol H2O. A bin needs
      at least 10 records and a mean ET above 0.01 mm h-1. Across sites, equal weight per site, bins reached
      by fewer than half the sites are left out. The exponent fit maps each bin edge to VPD in hPa with
      the site mean and standard deviation (CD-Ygb converted from Pa).
    columns:
      bin: Lower edge of the 0.1 σ bin of the VPD z-score
      n_sites: Number of sites with a value in the bin, count
      wue_relative: 'perSite: bin WUE divided by site_wue, unitless. acrossSites: median across sites
        of that ratio'
      q25: 25th percentile across sites of wue_relative in the bin
      q75: 75th percentile across sites of wue_relative in the bin
      wue_absolute: Median across sites of the bin WUE, µmol CO2 per mmol H2O
      SITE: FLUXNET site code
      exponent: Slope of log WUE on log VPD (hPa) across the bins of the site, unitless, -1 means no stomatal
        adjustment
      n_bins: Number of bins of the site in the fit, positive VPD and WUE only, count
      gpp: Mean GPP of the records in the bin, µmol CO2 m-2 s-1
      et: Mean ET of the records in the bin, mm h-1
      n: Number of records in the bin, count
      wue: Bin WUE, gpp over et converted to mmol H2O m-2 s-1, µmol CO2 per mmol H2O
      site_wue: WUE of the site over all its modeled records, mean GPP over mean ET, µmol CO2 per mmol
        H2O
  outputs/80_info/86_INFO_SiteSkill:
    row: 'SiteSkill_NEP_ZSCORE: one row per site and cross-validation variant. _summary: one row per variant
      and metric'
    note: Skill of the out-of-sample predictions of the NEP z-score stored in the SHAP files, nothing
      refitted. RMSE, MAE and bias are in σ of the within-site NEP z-score. Bias is prediction minus observation.
      R2 is 1 minus the sum of squared errors over the sum of squares about the mean of the same subset.
      R2 can be low or negative in Stage 8 and the VPD tail. Metrics are empty when the subset has
      fewer than 10 records. The VPD tail is VPD z-score above 1.2816 σ, any TA and SWC. Feeds Supplementary
      Data 2.
    columns:
      site: FLUXNET site code
      variant: random-folds (main analysis, shuffled 5-fold) or blocked-cv (leave-one-year-out)
      all_n: Number of modeled records with observation and prediction, count
      all_r2: R2 over all records, unitless
      all_rmse: Root mean square error over all records, in σ
      all_mae: Mean absolute error over all records, in σ
      all_bias: Mean of prediction minus observation over all records, in σ
      stage8_n: Number of Stage 8 records, count
      stage8_r2: R2 over the Stage 8 records, unitless
      stage8_rmse: Root mean square error over the Stage 8 records, in σ
      stage8_mae: Mean absolute error over the Stage 8 records, in σ
      stage8_bias: Mean of prediction minus observation over the Stage 8 records, in σ
      vpdtail_n: Number of VPD tail records, count
      vpdtail_r2: R2 over the VPD tail records, unitless
      vpdtail_rmse: Root mean square error over the VPD tail records, in σ
      vpdtail_mae: Mean absolute error over the VPD tail records, in σ
      vpdtail_bias: Mean of prediction minus observation over the VPD tail records, in σ
      metric: Name of the per-site column summarized, e.g. all_r2
      count: Number of sites with a value of the metric, count
      25%: 25th percentile across sites of the metric
      50%: Median across sites of the metric
      75%: 75th percentile across sites of the metric
  outputs/80_info/87_INFO_StageCutoffPercentiles:
    row: 'StageCutoffPercentiles_NEP_ZSCORE: one row per site and driver. _summary: one row per driver
      and cut-off'
    note: Where the fixed stage cut-offs fall in the site distributions of the drivers. Cut-offs a = 0.31863936,
      b = 0.71436744 and c = 1.28155157 σ, read from src/stages.py. Shares are over the records of the
      SHAP file of the site (the modeled records) with a value of the driver. Summary statistics are across
      sites, equal weight per site. Shares are fractions 0 to 1. Feeds the lower part of Supplementary
      Table 3.
    columns:
      site: FLUXNET site code
      driver: 'Driver column: TA_ZSCORE, VPD_ZSCORE, SWC_ZSCORE or SWIN_ZSCORE'
      n: Number of records of the site with a value of the driver, count
      share_below_-c: Fraction of the records with driver z-score at or below -c (-1.2816 σ)
      share_below_-b: Fraction of the records with driver z-score at or below -b (-0.7144 σ)
      share_below_-a: Fraction of the records with driver z-score at or below -a (-0.3186 σ)
      share_below_a: Fraction of the records with driver z-score at or below a (0.3186 σ)
      share_below_b: Fraction of the records with driver z-score at or below b (0.7144 σ)
      share_below_c: Fraction of the records with driver z-score at or below c (1.2816 σ)
      cutoff: 'Cut-off label: -c, -b, -a, a, b, c'
      sigma: Cut-off value in σ
      gaussian: Standard normal share at or below the cut-off, fraction 0 to 1
      sites: Number of sites, count
      q25: 25th percentile across sites of the share at or below the cut-off
      median: Median across sites of the share at or below the cut-off
      q75: 75th percentile across sites of the share at or below the cut-off
      median_minus_gaussian: median minus gaussian, fraction 0 to 1
  outputs/80_info/88_INFO_StageOrderTest:
    row: 'StageOrderTest: one row per stage sequence and stage. _VERDICT: one row per stage sequence'
    note: Compares the main stage order (published, extreme VPD added at Stage 8) with the mirrored order
      of src/stages.py (VPD escalated, extreme soil dryness added last). Per site, the SHAP contributions
      are averaged over the records of the stage (script 44), then averaged across sites, equal weight
      per site, skipping sites with no record in the stage. All effects in σ of the within-site NEP z-score.
      The net effect is the per-record sum of the SHAP values of TA, VPD, SWC and SWIN.
    columns:
      sequence: 'Stage order: published or mirrored'
      stage: Stage number, 1 to 8
      sites: Number of site rows for the stage, all sites including those with no record in the stage
      records: Records in the stage summed over sites, count
      condition: Stage label of the stage function, e.g. hot and 2 driest
      net: Mean across sites of the site mean net effect, in σ
      VPD: Mean across sites of the site mean VPD SHAP contribution, in σ
      TA: Mean across sites of the site mean TA SHAP contribution, in σ
      SM: Mean across sites of the site mean soil water SHAP contribution, in σ
      SW: Mean across sites of the site mean shortwave radiation SHAP contribution, in σ
      'Unnamed: 0': 'Written index: stage order, published or mirrored'
      second_last_net: net at Stage 7 of the order, in σ
      last_net: net at Stage 8 of the order, in σ
      final_step: last_net minus second_last_net, in σ
  outputs/80_info/89_INFO_StageMatching_SUMMARY:
    row: 'StageMatching_NEP_ZSCORE: one row per site with Stage 7 and Stage 8 records and matching method.
      _SUMMARY: one row per matching method'
    note: 'Each Stage 8 record is matched to the nearest Stage 7 record of the same site (Euclidean distance
      on the TA, SWC and SWIN z-scores), with replacement. strict: same calendar month, hour of day within
      1 h and each z-score within 0.5 σ. covariate: the 0.5 σ caliper only. Differences are Stage 8 minus
      Stage 7. SHAP contributions and the net effect (sum of the four SHAP values per record) are in σ
      of the within-site NEP z-score. Covariate differences are in σ of the driver z-score. The d_ columns
      of the per-site file are empty for sites without a matched pair. Across-site statistics use the
      sites with pairs, equal weight per site, unless named otherwise. Shares are fractions 0 to 1. Nothing
      is refitted.'
    columns:
      SITE: FLUXNET site code
      IGBP: IGBP forest type of the site
      matching: 'Matching method: strict or covariate'
      n_stage7: Number of Stage 7 records of the site, count
      n_stage8: Number of Stage 8 records of the site, count
      n_matched: Number of Stage 8 records with a Stage 7 partner, count
      share_matched: n_matched over n_stage8, fraction 0 to 1
      net_stage7_all: Mean net effect over all Stage 7 records of the site, unmatched, in σ
      net_stage8_all: Mean net effect over all Stage 8 records of the site, unmatched, in σ
      vpd_stage7_all: Mean VPD SHAP contribution over all Stage 7 records of the site, unmatched, in σ
      vpd_stage8_all: Mean VPD SHAP contribution over all Stage 8 records of the site, unmatched, in σ
      d_TA_ZSCORE: Mean TA z-score of the matched Stage 8 records minus that of their Stage 7 partners,
        covariate balance, in σ
      d_SWC_ZSCORE: Mean SWC z-score of the matched Stage 8 records minus that of their Stage 7 partners,
        covariate balance, in σ
      d_SWIN_ZSCORE: Mean SWIN z-score of the matched Stage 8 records minus that of their Stage 7 partners,
        covariate balance, in σ
      d_VPD_ZSCORE: Mean VPD z-score of the matched Stage 8 records minus that of their Stage 7 partners,
        not matched on, the VPD contrast, in σ
      d_net: Mean net effect of the matched Stage 8 records minus that of their Stage 7 partners, in σ
      d_VPD: Same difference for the VPD SHAP contribution, in σ
      d_TA: Same difference for the TA SHAP contribution, in σ
      d_SM: Same difference for the soil water SHAP contribution, in σ
      d_SW: Same difference for the shortwave radiation SHAP contribution, in σ
      sites_both_stages: Number of sites with Stage 7 and Stage 8 records, count
      sites_with_pairs: Number of sites with at least one matched pair, count
      stage8_records: Stage 8 records summed over sites with both stages, count
      stage8_records_matched: Matched Stage 8 records summed over sites, count
      share_records_matched: stage8_records_matched over stage8_records, fraction 0 to 1
      balance_TA_ZSCORE_mean: Mean across sites with pairs of d_TA_ZSCORE, in σ
      balance_SWC_ZSCORE_mean: Mean across sites with pairs of d_SWC_ZSCORE, in σ
      balance_SWIN_ZSCORE_mean: Mean across sites with pairs of d_SWIN_ZSCORE, in σ
      balance_VPD_ZSCORE_mean: Mean across sites with pairs of d_VPD_ZSCORE, in σ
      d_net_median: Median across sites with pairs of d_net, in σ
      d_net_mean: Mean across sites with pairs of d_net, in σ
      d_net_share_negative: Share of sites with pairs with negative d_net, fraction 0 to 1
      d_VPD_median: Median across sites with pairs of d_VPD, in σ
      d_VPD_mean: Mean across sites with pairs of d_VPD, in σ
      d_VPD_share_negative: Share of sites with pairs with negative d_VPD, fraction 0 to 1
      d_TA_median: Median across sites with pairs of d_TA, in σ
      d_TA_mean: Mean across sites with pairs of d_TA, in σ
      d_TA_share_negative: Share of sites with pairs with negative d_TA, fraction 0 to 1
      d_SM_median: Median across sites with pairs of d_SM, in σ
      d_SM_mean: Mean across sites with pairs of d_SM, in σ
      d_SM_share_negative: Share of sites with pairs with negative d_SM, fraction 0 to 1
      d_SW_median: Median across sites with pairs of d_SW, in σ
      d_SW_mean: Mean across sites with pairs of d_SW, in σ
      d_SW_share_negative: Share of sites with pairs with negative d_SW, fraction 0 to 1
      unmatched_net_diff_mean_sites_with_pairs: Mean across sites with pairs of net_stage8_all minus net_stage7_all,
        in σ
      unmatched_net_share_negative_sites_with_pairs: Share of sites with pairs where net_stage8_all is
        below net_stage7_all, fraction 0 to 1
      unmatched_net_diff_mean_all_common: Mean across all sites with both stages of net_stage8_all minus
        net_stage7_all, in σ
      unmatched_net_share_negative_all_common: Share of all sites with both stages where net_stage8_all
        is below net_stage7_all, fraction 0 to 1
