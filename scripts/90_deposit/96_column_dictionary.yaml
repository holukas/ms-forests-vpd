        in kPa
      Median threshold (σ): Median across sites with a crossing of the per-site threshold, in σ of the
        VPD z-score
      Median threshold (kPa): Median across sites with a crossing of the per-site threshold in kPa, (site
        mean VPD + threshold × site VPD standard deviation) / 10
      Sites with a zero crossing: Number of sites of the quartile with a positive to negative zero
        crossing of the fitted curve, count
  outputs/50_plots/64_SUPPDATA-2:
    row: One row per site and cross-validation split
    note: Source Data of Supplementary Data 2, built from 86_INFO_SiteSkill_NEP_ZSCORE.csv. The xlsx holds
      the same table and is deposited as Supplementary Data 2, same columns. Skill of the out-of-sample
      predictions of the NEP z-score stored in the SHAP files, nothing refitted. RMSE, MAE and bias are
      in σ of the within-site NEP z-score. Bias is prediction minus observation. R2 is 1 minus the sum
      of squared errors over the sum of squares about the mean of the same subset. R2 can be low or
      negative in Stage 8 and the VPD tail where the NEP variance is small. Metrics are empty when the
      subset has fewer than 10 records. Sites with a single year have no Leave-one-year-out row. Metrics
      rounded to three decimals.
    columns:
      Site: FLUXNET site code
      Forest type (IGBP): IGBP forest type of the site (ENF, DBF, MF, EBF)
      Cross-validation split: Shuffled 5-fold (main analysis, random folds) or Leave-one-year-out (one
        fold per year)
      All records, n: Number of modeled records of the site with observation and prediction, count
      All records, R2: R2 of the predictions over all records, unitless
      All records, RMSE (σ): Root mean square error over all records, in σ
      All records, MAE (σ): Mean absolute error over all records, in σ
      All records, Bias (σ): Mean of prediction minus observation over all records, in σ
      Stage 8, n: Number of Stage 8 records (TA z > 1.28, SWC z < -1.28 and VPD z > 1.28 σ), count
      Stage 8, R2: R2 over the Stage 8 records, against their own mean, unitless
      Stage 8, RMSE (σ): Root mean square error over the Stage 8 records, in σ
      Stage 8, MAE (σ): Mean absolute error over the Stage 8 records, in σ
      Stage 8, Bias (σ): Mean of prediction minus observation over the Stage 8 records, in σ
      VPD tail (> 1.28σ), n: Number of records with VPD z-score above 1.2816 σ, any TA and SWC, count
      VPD tail (> 1.28σ), R2: R2 over the VPD tail records, against their own mean, unitless
      VPD tail (> 1.28σ), RMSE (σ): Root mean square error over the VPD tail records, in σ
      VPD tail (> 1.28σ), MAE (σ): Mean absolute error over the VPD tail records, in σ
      VPD tail (> 1.28σ), Bias (σ): Mean of prediction minus observation over the VPD tail records, in
        σ
