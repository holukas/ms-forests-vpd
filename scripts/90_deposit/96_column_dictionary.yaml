      Peak of the VPD effect (σ): VPD z-score where the fitted VPD effect on NEP is most positive, in
        σ
      Peak of the VPD effect (kPa): Peak of the VPD effect converted to VPD in kPa
      Steepest decline (σ): VPD z-score of the most negative slope of the fitted curve at or after the
        peak, in σ, may have the range edge flag
      Steepest decline (kPa): Steepest decline converted to VPD in kPa, may have the range edge flag
      Zero crossing, the threshold (σ): VPD z-score of the highest crossing of the fitted curve from positive
