  outputs/50_plots/63_SUPPTABLE-8:
    row: One row per quartile of site maximum VPD, Q1 lowest to Q4 highest
    note: Source Data of Supplementary Table 8, built from 82_INFO_ThresholdVsSiteVPDRange.csv. The 208 sites are split into quartiles of their maximum VPD
