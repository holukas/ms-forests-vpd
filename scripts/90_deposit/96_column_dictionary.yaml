      TA: Condition on the air temperature z-score for the stage, as text, in σ
      SM: Condition on the soil water content (SWC) z-score for the stage, as text, in σ
      VPD: Condition on the VPD z-score for the stage, as text, in σ
      SW: Condition on the incoming shortwave radiation z-score, always all (unrestricted)
      Cut-off (sigma): Stage cut-off in σ of the within-site z-score, rounded to two decimals
      Standard normal (%): Share of a standard normal distribution at or below the cut-off, in %
